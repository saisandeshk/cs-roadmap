name: Site

# Validates the research data and builds the website on every push and pull request.
# Pushes to the default branch also deploy to GitHub Pages (Settings > Pages > Source: GitHub Actions).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install PyYAML
        run: python3 -c "import yaml" 2>/dev/null || python3 -m pip install --user pyyaml || python3 -m pip install --user --break-system-packages pyyaml

      - name: Validate research data
        run: python3 research/tools/validate.py

      - name: Build site
        run: python3 site/build.py --out _site

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
