<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CS Roadmap</title>
<meta name="description" content="A map of computer science: every topic names the text and course to learn it from, and paths run through shared topics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Overpass:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<script>
(function () {
  // apply the saved light/dark choice before first paint (dark unless the reader chose otherwise)
  var r = document.documentElement;
  r.setAttribute('data-host-theme', r.getAttribute('data-theme') || '');
  var s = {};
  try { s = JSON.parse(localStorage.getItem('cs-roadmap:v1:settings-v2') || '{}') || {}; } catch (e) { s = {}; }
  var mode = s.mode || 'dark';
  if (mode === 'light' || mode === 'dark') r.setAttribute('data-theme', mode);
})();
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <div class="topbar-inner wrap wrap-wide">
    <a class="brand" href="#home" aria-label="CS Roadmap home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 7v6c0 3 2 5 5 5h4c3 0 5 2 5 5v2" /><path d="M9 13v12" /><circle cx="9" cy="7" r="3.2" /><circle cx="23" cy="25" r="3.2" /><circle cx="9" cy="25" r="3.2" /></svg>
      <span class="brand-name">CS Roadmap</span>
    </a>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <div class="topbar-actions">
      <div class="search" role="search">
        <svg class="ic search-ic" aria-hidden="true"><use href="#i-search"></use></svg>
        <input id="search" type="search" placeholder="Search topics and resources" autocomplete="off" spellcheck="false" aria-label="Search topics and resources" aria-controls="search-results" aria-expanded="false">
        <kbd class="search-key" aria-hidden="true">/</kbd>
        <div id="search-results" class="search-results" role="listbox" hidden></div>
      </div>
      <button type="button" class="btn btn-quiet btn-icon" id="btn-theme" data-action="toggle-theme" aria-label="Switch light or dark">
        <svg class="ic" aria-hidden="true"><use href="#i-sun"></use></svg>
      </button>
      <button type="button" class="btn btn-quiet" id="btn-options" data-action="options" aria-haspopup="dialog">
        <svg class="ic" aria-hidden="true"><use href="#i-sliders"></use></svg><span class="btn-label">Settings</span>
      </button>
    </div>
  </div>
</header>
<main id="main" tabindex="-1"><div class="wrap loading">Loading the roadmap…</div></main>
<footer class="footer"><div class="wrap wrap-wide" id="footer"></div></footer>
<dialog id="dlg-options" class="dlg" aria-labelledby="dlg-options-title"></dialog>
