- {id: probabilistic-graphical-models, group: G5, paths: [ml-foundations], optional: true, branch: probabilistic-ml, hard: [probability, ml-fundamentals], soft: [bayesian-inference], title: Probabilistic Graphical Models, scope: 'Bayes nets, MRFs, exact and approximate inference, learning.'}
