- {id: applied-ml-practice, group: G5, paths: [ml-foundations], hard: [ml-fundamentals, scientific-python], soft: [], title: 'Applied ML: Evaluation & Experimentation', scope: 'Splits and leakage, metrics, model selection, feature engineering, error analysis, calibration, distribution shift, experiment design.'}
- {id: deep-learning-fundamentals, group: G5, paths: [ml-foundations], hard: [ml-fundamentals, matrix-calculus], soft: [scientific-python], title: Deep Learning Fundamentals, scope: 'MLPs, backprop, losses, SGD/Adam, initialization and normalization, regularization, CNNs, RNNs, training dynamics.'}
