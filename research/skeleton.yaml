# Node skeleton for research. Structure only; final organization/presentation is NOT decided here.
# hard = cannot reasonably do this node without it; soft = helps, can be skipped by a motivated learner.
# branch = optional sub-route inside a path; optional = not needed to complete the path.
# ---------------- G1 Programming languages & tooling ----------------
# ---------------- G2 Mathematics ----------------
# ---------------- G3 Algorithms & theory ----------------
# ---------------- G4 Machine & OS ----------------
# ---------------- G5 ML foundations ----------------
# ---------------- G6 Vision & generative ----------------
# ---------------- G7 LLMs ----------------
# ---------------- G8 RL & safety ----------------
# ---------------- G9 ML systems ----------------
# ---------------- G10 Data & distributed ----------------
# ---------------- G11 Hardware & compilers ----------------
# ---------------- G12 Security & cryptography ----------------

paths:
  core: Core CS
  ml-foundations: ML & DL Foundations
  llm: LLMs & NLP
  rl: Reinforcement Learning
  vision: Computer Vision
  generative: Generative Models
  safety: AI Safety & Interpretability
  mlsys: ML Systems & GPU Computing
  distributed: Distributed Systems
  databases: Database Systems
  os-perf: OS Internals & Performance Engineering
  architecture: Computer Architecture & Hardware
  plc: Programming Languages & Compilers
  security: Security & Cryptography
  theory: Theory & Advanced Algorithms
groups:
  G1: Programming languages & tooling
  G2: Mathematics
  G3: Algorithms & theory
  G4: Machine & OS
  G5: ML foundations
  G6: Vision & generative
  G7: LLMs
  G8: RL & safety
  G9: ML systems
  G10: Data & distributed
  G11: Hardware & compilers
  G12: Security & cryptography

nodes:
- {id: python-programming, group: G1, paths: [core], hard: [], soft: [], title: 'Programming I: Python', scope: 'First programming course in Python: control flow, functions, recursion, data abstraction, OOP basics, simple algorithms (SICP-style intro).'}
- {id: python-in-depth, group: G1, paths: [core, ml-foundations], hard: [python-programming], soft: [dev-environment], title: Python in Depth, scope: 'Python data model, iterators/generators, decorators, typing, asyncio and the GIL, packaging, pytest; writing idiomatic production Python.'}
- {id: c-programming, group: G1, paths: [core], hard: [python-programming], soft: [dev-environment], title: 'Programming II: C', scope: 'Pointers, manual memory management, arrays/strings, structs, the C toolchain, undefined behavior, gdb/valgrind/sanitizers.'}
- {id: cpp-programming, group: G1, paths: [mlsys, os-perf], hard: [python-programming], soft: [c-programming], title: Modern C++, scope: 'RAII, templates, STL, move semantics, smart pointers, C++17/20/23 features, performance idioms.'}
- {id: rust-programming, group: G1, paths: [os-perf, security], optional: true, hard: [python-programming], soft: [c-programming], title: Rust, scope: 'Ownership and borrowing, traits, error handling, fearless concurrency, unsafe Rust, systems programming in Rust.'}
- {id: go-programming, group: G1, paths: [distributed], hard: [python-programming], soft: [c-programming, dev-environment], title: Go, scope: 'Go for systems/distributed programming: goroutines, channels, sync, testing; enough to do MIT 6.5840-style labs.'}
- {id: data-structures, group: G1, paths: [core], hard: [python-programming], soft: [dev-environment], title: Data Structures, scope: 'Lists, stacks/queues, trees, balanced BSTs, heaps, hash tables, graph representations, asymptotic basics; programming at scale (CS 61B-style).'}
- {id: software-construction, group: G1, paths: [core], hard: [python-programming], soft: [data-structures, dev-environment], title: Software Construction, scope: 'Specifications, testing, debugging, abstraction and ADTs, design, immutability, code review (MIT 6.1020-style).'}
- {id: dev-environment, group: G1, paths: [core], hard: [], soft: [python-programming], title: Developer Tooling, scope: 'Shell, Unix/Linux, git, editors, build systems (make/cmake), debuggers/profilers, containers basics (Missing Semester-style).'}
- {id: discrete-math, group: G2, paths: [core], hard: [], soft: [], title: Discrete Math & Proofs, scope: 'Logic, proof techniques, induction, sets/relations/functions, counting, graph theory, number theory, discrete probability intro.'}
- {id: calculus-single-variable, group: G2, paths: [core], hard: [], soft: [], title: 'Calculus I: Single Variable', scope: 'Limits, derivatives and their applications, integrals and the fundamental theorem, techniques of integration, sequences and series.'}
- {id: calculus-multivariable, group: G2, paths: [core], hard: [calculus-single-variable], soft: [], title: 'Calculus II: Multivariable', scope: 'Vectors, partial derivatives, gradients and directional derivatives, Lagrange multipliers, multiple integrals, vector calculus basics.'}
- {id: linear-algebra, group: G2, paths: [core], hard: [], soft: [], title: Linear Algebra, scope: 'Vector spaces, elimination, orthogonality, determinants, eigenvalues, SVD, with a computational view.'}
- {id: probability, group: G2, paths: [core], hard: [calculus-single-variable], soft: [discrete-math], title: Probability, scope: 'Random variables, distributions, expectation, conditioning, LLN/CLT, joint distributions, Markov chains intro.'}
- {id: statistics, group: G2, paths: [core, ml-foundations], hard: [probability], soft: [linear-algebra], title: Statistical Inference, scope: 'Estimation, MLE, hypothesis testing, confidence intervals, bootstrap, regression, Bayesian basics.'}
- {id: matrix-calculus, group: G2, paths: [ml-foundations], hard: [linear-algebra, calculus-multivariable], soft: [], title: Matrix Calculus, scope: 'Derivatives of vector/matrix functions, Jacobians, vector chain rule, forward vs reverse mode differentiation.'}
- {id: convex-optimization, group: G2, paths: [theory], hard: [linear-algebra, calculus-multivariable], soft: [matrix-calculus], title: Convex Optimization, scope: 'Convex sets and functions, LP/QP/SOCP/SDP modeling, duality and KKT, unconstrained and constrained minimization, interior-point methods.'}
- {id: optimization-for-ml, group: G2, paths: [ml-foundations], hard: [linear-algebra, calculus-multivariable], soft: [matrix-calculus, probability, convex-optimization], title: Optimization for Machine Learning, scope: 'Gradient descent, SGD and its variance, momentum and adaptive methods (Adam), learning-rate schedules, convergence basics, nonconvex training.'}
- {id: numerical-methods, group: G2, paths: [ml-foundations, mlsys], optional: true, branch: scientific-computing, hard: [linear-algebra], soft: [python-programming, calculus-single-variable, floating-point-and-low-precision], title: Numerical Computing, scope: 'Conditioning and stability, numerical linear algebra algorithms (LU, QR, SVD, eigenvalues), iterative and Krylov methods, nonlinear equations, ODE solvers basics.'}
- {id: information-theory, group: G2, paths: [generative, theory], hard: [probability], soft: [discrete-math, calculus-single-variable], title: Information Theory, scope: 'Entropy, KL divergence, mutual information, source/channel coding, compression; connections to ML.'}
- {id: algorithms, group: G3, paths: [core], hard: [data-structures, discrete-math], soft: [], title: Algorithms I, scope: 'Asymptotics, sorting, searching, hashing, graph algorithms (BFS/DFS/shortest paths/MST), dynamic programming, greedy intro.'}
- {id: algorithm-design, group: G3, paths: [core, theory], hard: [algorithms], soft: [probability, discrete-math], title: Algorithm Design & Analysis, scope: 'Divide and conquer, greedy proofs, DP, network flow, NP-completeness and reductions, intro randomized and approximation algorithms.'}
- {id: theory-of-computation, group: G3, paths: [core, theory], hard: [discrete-math], soft: [algorithms], title: Theory of Computation, scope: 'Automata, regular and context-free languages, Turing machines, decidability, P vs NP.'}
- {id: advanced-algorithms, group: G3, paths: [theory], hard: [algorithm-design], soft: [probability, linear-algebra], title: Advanced Algorithms, scope: 'Flows and matchings, LP and duality, online algorithms and competitive analysis, external-memory and parallel algorithm design.'}
- {id: advanced-data-structures, group: G3, paths: [theory], hard: [algorithm-design], soft: [], title: Advanced Data Structures, scope: 'Amortized and persistent structures, splay trees and dynamic optimality, integer structures (van Emde Boas, fusion), hashing, cache-oblivious structures.'}
- {id: randomized-algorithms, group: G3, paths: [theory], hard: [algorithm-design, probability], soft: [linear-algebra], title: Randomized Algorithms, scope: 'Concentration bounds, probabilistic method, hashing, Markov chains, sketching and streaming.'}
- {id: approximation-algorithms, group: G3, paths: [theory], hard: [advanced-algorithms], soft: [computational-complexity, linear-algebra, convex-optimization], title: Approximation Algorithms, scope: 'LP rounding, primal-dual, SDP relaxations, hardness of approximation.'}
- {id: computational-complexity, group: G3, paths: [theory], hard: [theory-of-computation, algorithm-design], soft: [probability, linear-algebra], title: Computational Complexity, scope: 'Hierarchy theorems, space complexity, the polynomial hierarchy, randomized classes, Boolean circuits.'}
- {id: advanced-complexity, group: G3, paths: [theory], optional: true, hard: [computational-complexity], soft: [], title: 'Advanced Complexity: Proofs & Pseudorandomness', scope: 'Interactive proofs (IP = PSPACE), PCP theorem, circuit lower bounds, derandomization and hardness vs randomness.'}
- {id: learning-theory, group: G3, paths: [theory], hard: [probability, ml-fundamentals], soft: [convex-optimization, linear-algebra, algorithm-design], title: Learning Theory, scope: 'PAC learning, VC dimension, Rademacher complexity, uniform convergence, kernels and margins, online learning and regret.'}
- {id: deep-learning-theory, group: G3, paths: [theory], optional: true, hard: [learning-theory, deep-learning-fundamentals], soft: [], title: Theory of Deep Learning, scope: 'Approximation, optimization and generalization of overparameterized networks, NTK, implicit bias, double descent.'}
- {id: quantum-computing, group: G3, paths: [theory], optional: true, hard: [linear-algebra, probability], soft: [theory-of-computation, algorithm-design], title: Quantum Computation, scope: 'Qubits, circuits, Shor and Grover, quantum information basics. Elective.'}
- {id: computer-systems, group: G4, paths: [core], hard: [c-programming], soft: [], title: Computer Systems (programmer's view), scope: 'Data representation, x86-64 machine code, memory hierarchy, linking, exceptional control flow, virtual memory, allocators, system I/O, network programming and concurrency basics (CS:APP).'}
- {id: computer-architecture, group: G4, paths: [core, architecture], hard: [computer-systems], soft: [digital-logic], title: Computer Architecture (organization), scope: 'ISA (RISC-V), assembly, datapath and control, pipelining and hazards, caches, VM hardware, SIMD and multicore basics.'}
- {id: operating-systems, group: G4, paths: [core], hard: [computer-systems], soft: [], title: Operating Systems, scope: 'Processes, scheduling, virtual memory, concurrency primitives, file systems, crash consistency (concepts).'}
- {id: os-kernel-implementation, group: G4, paths: [core, os-perf], hard: [operating-systems], soft: [computer-architecture], title: OS Implementation (kernel labs), scope: 'Implementing syscalls, page tables, traps, COW fork, threads, a file system inside a teaching kernel.'}
- {id: concurrent-programming, group: G4, paths: [core, os-perf], hard: [computer-systems], soft: [operating-systems, rust-programming], title: Concurrent Programming, scope: 'Threads, locks, condition variables, memory models, atomics, lock-free data structures, deadlock, async I/O.'}
- {id: parallel-programming, group: G4, paths: [core, mlsys], hard: [computer-systems], soft: [computer-architecture, concurrent-programming], title: Parallel Programming, scope: 'Parallel models (SIMD, multicore, GPU intro), work/span, OpenMP, MPI basics, synchronization cost, locality, parallel performance analysis.'}
- {id: performance-engineering, group: G4, paths: [os-perf, mlsys], hard: [computer-systems, algorithms], soft: [parallel-programming, computer-architecture], title: Performance Engineering, scope: 'Work/span, cache-efficient algorithms, vectorization, bit hacks, profiling-driven optimization of software.'}
- {id: performance-analysis, group: G4, paths: [os-perf], hard: [operating-systems], soft: [dev-environment], title: Performance Analysis & Observability, scope: 'Methodologies (USE), CPU/memory/disk/network analysis, perf, flame graphs, eBPF tracing.'}
- {id: high-performance-python, group: G4, paths: [os-perf, mlsys], hard: [python-in-depth], soft: [computer-systems, parallel-programming], title: High-Performance Python, scope: 'Profiling Python, NumPy vectorization, Numba/Cython, multiprocessing, memory efficiency.'}
- {id: linux-kernel-internals, group: G4, paths: [os-perf], hard: [os-kernel-implementation], soft: [concurrent-programming, computer-architecture], title: Linux Kernel Internals, scope: 'Kernel architecture, scheduler, memory management, VFS, synchronization (locks, RCU), modules and the kernel development workflow.'}
- {id: linux-device-drivers, group: G4, paths: [os-perf], optional: true, hard: [linux-kernel-internals], soft: [computer-architecture], title: Linux Device Drivers, scope: 'Driver model, character and block drivers, interrupts and deferred work, DMA, device tree, platform/I2C/SPI drivers.'}
- {id: virtualization-and-containers, group: G4, paths: [os-perf], hard: [operating-systems], soft: [computer-architecture], title: Virtualization & Containers, scope: 'Hypervisors, hardware-assisted virtualization, VMs, namespaces/cgroups, containers, microVMs.'}
- {id: storage-and-file-systems, group: G4, paths: [os-perf, databases], hard: [operating-systems], soft: [concurrent-programming], title: Storage & File Systems, scope: 'File system design (FFS, LFS, journaling, CoW), SSD/flash, storage stack, RAID.'}
- {id: advanced-operating-systems, group: G4, paths: [os-perf], hard: [os-kernel-implementation], soft: [concurrent-programming, linux-kernel-internals], title: Advanced OS & Systems Research, scope: 'Classic and modern systems papers: microkernels, exokernels, kernel bypass, scheduling, isolation; reading systems research.'}
- {id: intro-ai, group: G5, paths: [core], hard: [python-programming, probability], soft: [algorithms], title: Introduction to AI, scope: 'Search, CSPs, games, MDPs and RL intro, Bayes nets, intro ML (CS 188-style).'}
- {id: scientific-python, group: G5, paths: [ml-foundations], hard: [python-programming], soft: [], title: Scientific Python & Data Tooling, scope: 'NumPy, pandas, matplotlib, Jupyter, scikit-learn API basics.'}
