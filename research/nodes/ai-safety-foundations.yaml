  role: reference
  kind: course
  title: BlueDot Technical AI Safety curriculum
  by: BlueDot Impact
  url: https://bluedot.org/courses/technical-ai-safety
  edition_or_term: Current cohorts Nov 2026 - Jan 2027
  access: free
  use: Unit 1 "The technical challenge with AI" readings (https://bluedot.org/courses/technical-ai-safety/1/1) as the next step after this node; the curriculum is browsable without joining a cohort.
