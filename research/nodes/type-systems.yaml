id: type-systems
title: Type Systems & Semantics
group: G11
paths: [plc]
hard: [programming-language-concepts, discrete-math]
soft: []
scope: Operational semantics, lambda calculus, type soundness, polymorphism, subtyping.
level: advanced
estimated_hours: 80
resources:
- {id: tapl, role: primary-text, kind: book, title: Types and Programming Languages, by: Benjamin C. Pierce, url: 'https://www.cis.upenn.edu/~bcpierce/tapl/', edition_or_term: 'MIT Press, 2002 (still the standard; book site with errata and OCaml checkers)', access: paid, use: 'Ch. 1-3 and 5-7 (untyped arithmetic and the untyped lambda calculus, nameless representation), 8-11 (typed arithmetic, simply typed lambda calculus, simple extensions), 12 (normalization), 13-14 (references, exceptions), 15-16 (subtyping and its metatheory), 20 (recursive types), 22-25 (type reconstruction, System F, existential types), plus selected ch. 26, 29-30 (bounded quantification, type operators, higher-order polymorphism). Do the starred exercises on paper.', why: 'The standard text: precise definitions, type-safety (progress/preservation) proofs, and a running implementation story; no other book covers subtyping, recursive types and System F so completely at this accessible level. Paid; publisher page not scriptable but the book site opened.', verified: true}
- id: penn-cis5000
  role: primary-course
  kind: course
  title: Penn CIS 5000 Software Foundations (Lean edition)
  by: University of Pennsylvania (Michael Hicks, Fall 2026)
  url: https://www.engineering.upenn.edu/~cis5000/current/index.html
  edition_or_term: Fall 2026
  access: free
  use: Part III Type Systems (simply typed lambda calculus, type safety, subtyping) after Part I Logical Foundations and Part II Hoare Logic; the course site hosts the Lean versions of the Software Foundations volumes (LF, Hoare Logic, Type Systems) as HTML and .lean files and zips (sf-lf-lean.zip, sf-hl-lean.zip, sf-ts-lean.zip), plus the syllabus, schedule and Lean setup page.
  why: A current machine-checked course (Fall 2026 now uses Lean instead of Rocq) in which every type-safety proof is yours to write; lecture recordings are Canvas-only, but the full text and Lean source files are public. TAPL is the supplementary text.
  verified: true
  course: {latest_term: Fall 2026, latest_url: 'https://www.engineering.upenn.edu/~cis5000/current/index.html', videos: enrolled-only, public_videos_term: none found for CIS 5000/500; see OPLSS and DeepSpec 2017/2018 lectures, public_videos_url: 'https://www.cs.uoregon.edu/research/summerschool/summer26/topics.php', assignments: partial, assignments_url: 'https://www.engineering.upenn.edu/~cis5000/current/syllabus.html'}
- {id: sf-plf, role: secondary, kind: book, title: 'Software Foundations, Volume 2: Programming Language Foundations (Rocq)', by: Benjamin C. Pierce et al., url: 'https://softwarefoundations.cis.upenn.edu/plf-current/index.html', edition_or_term: Version 7.1 (2026-08-24; Rocq/Coq 9.0 or later), access: free, use: 'Smallstep (small-step semantics), Types (typed arithmetic), Stlc and StlcProp (simply typed lambda calculus, progress and preservation), MoreStlc, Sub (subtyping), Typechecking, Records, References, RecordSub, Norm (normalization), and optionally PE. Do the exercises in Rocq.', why: 'Machine-checked version of the TAPL core in a free, auto-graded-by-the-compiler format; the Lean edition at CIS 5000 follows the same structure.', verified: true}
- {id: pfpl, role: secondary, kind: book, title: 'Practical Foundations for Programming Languages, 2nd edition', by: Robert Harper, url: 'https://www.cs.cmu.edu/~rwh/pfpl/', edition_or_term: 'Second edition (Cambridge University Press, 2016); free abbreviated online edition and a third-edition working draft on the author page', access: mixed, use: 'Parts on statics and dynamics, finite data types, types and propositions, system F, recursive types, dynamic dispatch, and control; read chosen chapters for the type-theoretic (judgmental) view and Harper''s supplements (''Structure of an Interpreter'', ''Church''s lambda calculus'').', why: 'A more abstract, type-theory-first approach complementary to TAPL; the author posts a free abbreviated edition and drafts.', verified: true}
- {id: plfa, role: secondary, kind: book, title: Programming Language Foundations in Agda, by: 'Philip Wadler, Wen Kokke, Jeremy G. Siek', url: 'https://plfa.github.io/', edition_or_term: Free online (checked 2026-11-18), access: free, use: 'Part 1 (Logical Foundations: naturals, induction, relations, equality, isomorphism, connectives, negation, quantifiers, decidability, lists) and Part 2 (Programming Language Foundations: lambda, properties, DeBruijn, more, inference, untyped, confluence, bidirectional).', why: 'Alternative proof-assistant rendering (Agda) of the same material with a stress on the Curry-Howard connection; pick Lean/Rocq or Agda, not all three.', verified: true}
- {id: oplss-types, role: secondary, kind: video-series, title: 'Oregon Programming Languages Summer School (OPLSS) 2026: Types, Proofs, and Program Logics', by: 'Azevedo de Amorim, Dreyer, Gardner et al.', url: 'https://www.cs.uoregon.edu/research/summerschool/summer26/topics.php', edition_or_term: 'June 22 - July 4, 2026 (archives to 2002 at https://www.cs.uoregon.edu/research/summerschool/archives.html)', access: free, use: 'Pick type-theory lecture series from the archive (e.g. 2017 ''A Spectrum of Types'', 2013-2016 ''Types, Logic, Semantics and Verification'' series) via https://www.cs.uoregon.edu/research/summerschool/archives.html; the 2026 edition (Rocq introduction, Iris separation logic, symbolic execution) is more relevant to program-verification.', why: Rare public video lectures from leading researchers on type theory and semantics; links per year in the archive., verified: true}
- {id: wadler-prop-types, role: secondary, kind: paper, title: Propositions as Types, by: Philip Wadler, url: 'https://homepages.inf.ed.ac.uk/wadler/papers/propositions-as-types/propositions-as-types.pdf', edition_or_term: 'Communications of the ACM, 2015', access: free, use: 'Read after the simply typed lambda calculus: natural deduction, lambda calculus, Curry-Howard, with historical context.', why: 'A short, readable account of why types and proofs coincide; motivates the move to proof assistants in program-verification.', verified: true}
- {id: sf-ts-lean-practice, role: practice, kind: tool, title: Software Foundations Type Systems volume (Lean) exercises, by: Penn CIS 5000 staff, url: 'https://www.engineering.upenn.edu/~cis5000/current/index.html', edition_or_term: Fall 2026 (sf-ts-lean.zip linked from the schedule), access: free, use: 'After Stlc basics, complete the exercises in the Type Systems volume''s .lean files: progress and preservation for STLC, subtyping, and extensions (check the course''s note that the Type Systems volume is posted when available).', why: 'Checked, runnable proof exercises with immediate feedback from the Lean kernel; the closest thing to an autograder for type-safety proofs.', verified: true}
- {id: plai-types, role: practice, kind: book, title: 'PLAI chapters on type checking, inference and polymorphism (implementation exercises)', by: Shriram Krishnamurthi, url: 'https://www.plai.org/', edition_or_term: Version 3.2.5, access: free, use: 'Implement a type checker, then Hindley-Milner-style inference with unification, and a polymorphic checker in Racket following the book''s chapters.', why: 'Implementation counterpart to the proofs in TAPL/SF: you write the checker whose soundness you prove elsewhere.', verified: true}
considered:
- {title: 'Cornell CS 6110 Advanced Programming Languages, Spring 2025', url: 'https://www.cs.cornell.edu/courses/cs6110/2025sp/', reason: 'Operational, axiomatic and denotational semantics, lambda calculus and types; lectures on Zoom/CMSX, public materials/videos not confirmed.'}
- {title: CMU 15-312 Foundations of Programming Languages / 15-814 Types and Programming Languages, url: 'https://www.cs.cmu.edu/~fp/courses/', reason: Harper/Pfenning courses; PFPL is the text. Course pages not found at stable URLs; index only.}
- {title: Cambridge Part IB Semantics of Programming Languages (2024-25), url: 'https://www.cl.cam.ac.uk/teaching/2425/Semantics/', reason: 'Short course with concise lecture notes on operational semantics, typing, subtyping and proof; page opened but notes not read in detail.'}
- {title: Brown CSCI 1730 (PLAI) type chapters, url: 'https://cs.brown.edu/courses/csci1730/2025/assignments.html', reason: Implementation-heavy; included as practice rather than primary.}
- {title: Theorem Proving in Lean 4 / Functional Programming in Lean, url: 'https://lean-lang.org/theorem_proving_in_lean4/', reason: Lean fundamentals needed for CIS 5000; listed under program-verification.}
notes: 'Route (about 80 h): TAPL ch. 1-11 and 13-16 with the CIS 5000 Lean volumes (or SF PLF in Rocq) for the proofs, then TAPL ch. 20 and 22-26 for recursive types and polymorphism. Choose Lean (CIS 5000''s current choice) or Rocq (SF, OPLSS 2026 introduction) and stay with it; the hard prereq discrete-math (induction, relations) is essential. Operational semantics appears in SF Smallstep/Imp and TAPL ch. 3-5; Penn''s order is proof-assistant intro -> Hoare logic -> type systems, so program-verification (Hoare part) could precede this node. Public video lectures are the weak spot; OPLSS archives and the DeepSpec 2017/2018 Coq lectures partially fill it.'
split_proposal: null
prereq_changes: 'Consider making the type-systems -> program-verification edge soft in one direction: Penn CIS 5000 and SF teach proof assistants and Hoare logic before type systems, so program-verification could depend on programming-language-concepts + discrete-math and type-systems could list program-verification''s proof-assistant basics as soft.'
open_questions: [Penn CIS 5000 lecture recordings are in Canvas only; whether the Type Systems Lean volume is already posted for Fall 2026 was not checked., TAPL publisher (MIT Press) page returned 403; the book site was opened and matches.]
last_verified: '2026-11-18'
