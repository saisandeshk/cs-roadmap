notes: "Primary pairing is W&S (free book) with Chekuri's Spring 2026 course; the course has fresh problem sets and notes but no current recordings (Fall 2021 only), and hardness of approximation needs the Moshkovitz/Svensson/W&S ch. 16 supplements. 130 hours assumes ~70% of the technique chapters plus a survey of hardness."
