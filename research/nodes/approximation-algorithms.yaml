  - {title: "Lau, Ravi, Singh, Iterative Methods in Combinatorial Optimization", url: "https://www.cambridge.org/core/books/iterative-methods-in-combinatorial-optimization/4BE4389EEFCCB795BB32259F4EB85694", reason: "Specialist text on iterated rounding; referenced by Chekuri; too narrow for primary."}
  - {title: "Hochbaum (ed.), Approximation Algorithms for NP-Hard Problems", url: "http://www.ieor.berkeley.edu/~hochbaum/html/book-aanp.html", reason: "Dated survey collection (1995)."}
