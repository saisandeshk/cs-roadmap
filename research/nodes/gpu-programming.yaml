id: gpu-programming
title: GPU Architecture & CUDA Programming
group: G9
paths:
- mlsys
- architecture
hard:
- parallel-programming
- c-programming
soft:
- cpp-programming
- computer-architecture
scope: GPU execution model, SMs/warps, memory hierarchy, CUDA basics, parallel patterns (reduction, scan, histogram).
level: intermediate
resources:
- id: pmpp-5e
  role: primary-text
  kind: book
  title: 'Programming Massively Parallel Processors: A Hands-on Approach, 5th edition'
  by: Wen-mei W. Hwu, David B. Kirk, Izzat El Hajj
  url: https://shop.elsevier.com/books/programming-massively-parallel-processors/hwu/978-0-443-43900-1
  edition_or_term: 5th edition, 2026 (Elsevier pages disagree on the exact date; 4th edition was May 2022)
  access: paid
  use: 'Part I (Ch. 1-6: heterogeneous computing, multidimensional grids, compute architecture and scheduling, memory architecture and locality, performance considerations); Part II patterns Ch. 7 convolution, 9 histogram, 10 reduction, 11 scan. Skip Ch. 8, 12-17 on a first pass (return to 15/16 sparse and wavefront, 18 deep learning, 19 multi-GPU later). Do the end-of-chapter exercises.'
  why: The standard GPU textbook. 5th edition adds warp-level programming, cooperative groups, atomics, multi-GPU/NCCL and an advanced matmul chapter (Ch. 23), so it now covers this node and part of the next two. Patterns (reduction, scan, histogram) are taught nowhere else this carefully.
  verified: true
- id: mit-6s894
  role: primary-course
  kind: course
  title: MIT 6.S894 Accelerated Computing
  by: Jonathan Ragan-Kelley and staff (MIT EECS)
  url: https://accelerated-computing.academy/fall25/
  edition_or_term: Fall 2025
  access: free
  use: Lectures 1-2 (PDP-11 problem, throughput processors), 7 and 9 (data-parallel primitives parts 1-2). Labs 1-3 (SIMD Mandelbrot, massively-parallel Mandelbrot, wave simulation) and Lab 7 (run-length compression) for the CUDA fundamentals. Lectures 3-6 and Labs 4-5 are in gpu-performance-optimization; Lecture 8 and Labs 6 and 10 are in gemm-and-tensor-cores.
  why: 'Newest and best public GPU performance course: first-principles architecture (why accelerators look like this), real CUDA labs, filmed lectures. Pairs with PMPP: PMPP gives breadth, this gives depth and a performance-engineering mindset.'
  verified: true
  course:
    latest_term: Fall 2025
    latest_url: https://accelerated-computing.academy/fall25/
    videos: public
    assignments: partial
    assignments_url: https://accelerated-computing.academy/fall25/labs
- id: cuda-programming-guide
  role: reference
  kind: docs
  title: CUDA Programming Guide (new unified guide)
  by: NVIDIA
  url: https://docs.nvidia.com/cuda/cuda-programming-guide/
  edition_or_term: CUDA 13.x docs (rewritten guide)
  access: free
  use: 'Look-up while doing labs: programming model, memory model, async copies, cooperative groups, compute capability tables.'
  why: Authoritative reference; the rewritten guide is far more readable than the old C++ Programming Guide. Not a first read.
  verified: true
- id: modal-gpu-glossary
  role: reference
  kind: website
  title: GPU Glossary
  by: Modal
  url: https://modal.com/gpu-glossary
  edition_or_term: 2025, maintained
  access: free
  use: Read the Device Hardware and Device Software sections (SM, warp scheduler, CUDA core, tensor core, memory hierarchy) once up front, then use as a lookup.
  why: Short, hyperlinked, accurate definitions of every GPU term; fastest way to get vocabulary straight.
  verified: true
- id: gpumode-lectures
  role: secondary
  kind: video-series
  title: GPU MODE lectures
  by: GPU MODE community (Mark Saroufim et al.)
  url: https://github.com/gpu-mode/lectures
  edition_or_term: 59+ lectures, ongoing (YouTube @GPUMODE)
  access: free
  use: Lectures 1 (profiling CUDA kernels in PyTorch), 2 (PMPP ch. 1-3 recap), 3 (getting started with CUDA), 4 (compute and memory architecture), 5 (CUDA for Python programmers), 9 (reductions), 20-21 (scan). Slides and code are in the repo.
  why: Free video companion to PMPP aimed at ML engineers; the lecture repo plus the Discord reading group is the de-facto community hub. Quality varies by speaker, so use selectively.
  verified: true
- id: gpu-puzzles
  role: practice
  kind: practice-site
  title: GPU Puzzles (Sasha Rush)
  by: Sasha Rush
  url: https://github.com/srush/GPU-Puzzles
  edition_or_term: Colab notebook, 14 puzzles
  access: free
  use: All 14 puzzles (map through matrix multiply) in Colab using Numba CUDA, before the first CUDA C++ lab.
  why: Gentlest on-ramp to thread/block indexing and shared memory with instant feedback; no local toolchain needed.
  verified: true
- id: leetgpu
  role: practice
  kind: practice-site
  title: LeetGPU challenges
  by: LeetGPU
  url: https://leetgpu.com/challenges
  edition_or_term: Hosted, multiple GPU backends
  access: account-required
  use: Easy tier, then Histogram and Prefix Sum in CUDA after PMPP Ch. 9 and 11 (Reduction, Transpose and Softmax are assigned to gpu-performance-optimization; Matrix Multiplication to gemm-and-tensor-cores).
  why: Browser-based GPU with auto-grading, so no hardware is needed; problems map directly onto PMPP patterns. Free tier available.
  verified: true
- id: olcf-cuda-series
  role: secondary
  kind: course
  title: NVIDIA/OLCF CUDA Training Series
  by: NVIDIA and Oak Ridge Leadership Computing Facility (Steve Abbott et al.)
  url: https://www.olcf.ornl.gov/cuda-training-series/
  edition_or_term: 13 modules, 2020-2021 (static)
  access: free
  use: Modules 1-5 (intro, shared memory, optimization parts 1-2, atomics/reductions/warp shuffle) and 12-13 (debugging, graphs) as a hands-on alternative with homework.
  why: 'Hidden gem: concise lecture plus hands-on exercises from the vendor''s own instructors; good if PMPP is too slow. Dated (Volta/Ampere) but fundamentals unchanged.'
  verified: true
  course:
    latest_term: 2020-2021 series
    latest_url: https://www.olcf.ornl.gov/cuda-training-series/
    videos: unknown
    assignments: public
    assignments_url: https://www.olcf.ornl.gov/cuda-training-series/
considered:
- title: Stanford CS149 Parallel Computing (Fall 2025)
  url: https://gfxcourses.stanford.edu/cs149
  reason: Excellent, but broader parallel-programming (ISPC, multicore) and owned by the parallel-programming node; GPU part is one lecture plus a CUDA assignment.
- title: CUDA C++ Best Practices Guide
  url: https://docs.nvidia.com/cuda/cuda-c-best-practices-guide/
  reason: Moved to gpu-performance-optimization where it is more useful.
- title: CMU 15-442 Machine Learning Systems (Spring 2026, GPU lectures)
  url: https://mlsyscourse.org/schedule
  reason: GPU content is only two lectures; slides public but videos unconfirmed. Used in other G9 nodes.
- title: UCSD CSE 291A/DSC 291 Deep Learning Systems (Spring 2026)
  url: https://haoailab.com/cse291-s26/
  reason: Two lectures on GPUs; broader systems course. Recording access unclear.
- title: Udacity CS344 Intro to Parallel Programming
  url: https://www.udacity.com/course/intro-to-parallel-programming--cs344
  reason: Classic but 2013-era CUDA and no longer maintained.
- title: Tensara
  url: https://tensara.org/
  reason: Practice site similar to LeetGPU; returned HTTP 522 when checked, so not listed.
notes: 'PMPP 5th edition now exists (publisher page verified), so it replaces the 4th edition as primary-text. The MIT course lab specs and starter code are public but the Telerun remote-run service and Gradescope are for enrolled students; self-learners need their own NVIDIA GPU or a cloud/Colab GPU (the labs target compute capability 8.6 / H100). 6.S894 lecture calendar lists 13 lectures but only lectures 1-10 have posted video (lecture 5 continuation pending); lectures 11-13: no video found. No 2026 term exists (spring26/fall26 pages return 404).'
split_proposal: null
prereq_changes: null
open_questions:
- Whether MIT 6.S894 Telerun is open to non-students (page says course lottery; likely not).
- Per-lecture video links on 6.S894 are YouTube youtu.be links on the lecture page; I confirmed the links exist but YouTube returned HTTP 429 to my fetcher so did not play them.
- Public availability of OLCF CUDA series recordings not confirmed.
