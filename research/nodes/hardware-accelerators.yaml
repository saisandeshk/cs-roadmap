prereq_changes: null
open_questions: [No public lecture videos of MIT 6.5930 itself exist for any term I could find; the authors' NeurIPS 2019 tutorial video (added after review R2) is the public substitute., 'Sze book DOI/Springer page was not openable (bot challenge); also, Stanford CS217 video/assignment availability unknown.', Gemmini GitHub page was opened via a fetch tool; individual tutorial links not tested.]
