id: consensus-and-replication
title: Consensus & Replication
group: G10
paths: [distributed]
hard: [distributed-systems-fundamentals]
soft: []
scope: "Primary-backup, Paxos, Raft, linearizability and consistency models, quorums, CRDTs."

level: advanced
estimated_hours: 90
resources:
  - id: ddia2-repl
    role: primary-text
    kind: book
    title: "Designing Data-Intensive Applications, 2nd edition: Replication and Consistency and Consensus"
    by: "Martin Kleppmann, Chris Riccomini"
    url: https://dataintensive.net/
    edition_or_term: "2nd edition (O'Reilly, March 2026, 670 pages)"
    access: paid
    use: "Chapter 6 'Replication' (single-leader, multi-leader, leaderless, quorums, replication lag, conflict resolution, CRDT and operational-transformation basics) and Chapter 10 'Consistency and Consensus' (linearizability, ordering and causality, total order broadcast, consensus; leave fencing and the unreliable-networks material of ch. 9 to distributed-systems-fundamentals). Read before or alongside the Raft lectures."
    why: "Best integrated explanation of replication styles and consistency models for practitioners, honest about trade-offs (quorum edge cases, CAP misuse), and it links to the primary literature. Readable before tackling the Raft paper."
    verified: true
  - id: mit-6824
    role: primary-course
    kind: course
    title: "MIT 6.5840 (6.824) Distributed Systems"
    by: "MIT (Robert Morris, Frans Kaashoek)"
    url: https://pdos.csail.mit.edu/6.824/
    edition_or_term: "Spring 2026"
    access: free
    use: "Spring 2026 lectures 6-7 (Raft), 9 (ZooKeeper), 13 (chain replication), plus 4 (Paxos) and 8 (linearizability) with their papers and FAQs; Lab 3 Raft (3A election, 3B log, 3C persistence, 3D snapshots) and Lab 4 fault-tolerant KV on Raft (https://pdos.csail.mit.edu/6.824/labs/lab-raft1.html). Video mapping to the Spring 2020 playlist: 2026 L6-7 (Raft) = 2020 L6-7 (2020 L5 is Go/Threads/Raft); 2026 L9 (ZooKeeper) = 2020 L8; 2026 L13 (chain replication) = 2020 L9 (CRAQ). Paxos (2026 L4) and linearizability (2026 L8) have no MIT video (2020 L4 is primary-backup replication); use Kleppmann lectures 5-8 and the Herlihy-Wing and Jepsen readings for those."
    why: "The reference course for this node: the Raft lab is the standard way to actually learn consensus, tests are public and thorough (they catch real protocol bugs), and the paper-driven lectures cover linearizability, ZooKeeper and chain replication. 2026 lectures are not recorded publicly, so the 2020 videos fill in for Raft, ZooKeeper and chain replication only."
    verified: true
    course:
      latest_term: "Spring 2026"
      latest_url: https://pdos.csail.mit.edu/6.824/schedule.html
      videos: none
      public_videos_term: "Spring 2020 (official MIT 6.824 YouTube playlist)"
      public_videos_url: "https://www.youtube.com/playlist?list=PLrw6a1wE39_tb2fErI4-WkMbsvGQk9_UB"
      assignments: public-with-autograder
      assignments_url: https://pdos.csail.mit.edu/6.824/labs/lab-raft1.html
  - id: kleppmann-notes-consensus
    role: secondary
    kind: book
    title: "Kleppmann, Distributed Systems lecture notes, Ch. 5-8"
    by: "Martin Kleppmann (University of Cambridge)"
    url: https://www.cl.cam.ac.uk/teaching/2526/ConcDisSys/dist-sys-notes.pdf
    edition_or_term: "2025-26 version (93 pages)"
    access: free
    use: "Ch. 5 (quorums, replication using broadcast), Ch. 6 (two-phase commit, linearizability), Ch. 7 (consensus, Raft), Ch. 8 (conflict resolution, CRDTs); then lectures 5-8 of the 2020 YouTube series (https://www.youtube.com/playlist?list=PLeKd45zvjcDFUEv_ohr_HdUFe97RItdiB)."
    why: "Gap: a rigorous, compact formal treatment (state machine replication from total-order broadcast, linearizability proofs) to pair with DDIA's informal one; includes exercises."
    verified: true
  - id: raft-paper
    role: secondary
    kind: paper
    title: "In Search of an Understandable Consensus Algorithm (extended version)"
    by: "Diego Ongaro, John Ousterhout"
    url: https://raft.github.io/raft.pdf
    edition_or_term: "USENIX ATC 2014, extended version"
    access: free
    use: "Read in full, with Figure 2 (the complete protocol summary) open while coding Lab 3. Also open the Raft site (https://raft.github.io/) and the visualization at https://thesecretlivesofdata.com/raft/."
    why: "Gap: the primary source MIT Lab 3 implements. The lab handout says to follow Figure 2 closely and does not require membership changes (Section 6)."
    verified: true
  - id: ongaro-thesis
    role: reference
    kind: paper
    title: "Consensus: Bridging Theory and Practice"
    by: "Diego Ongaro (Stanford PhD dissertation, 2014)"
    url: https://github.com/ongardie/dissertation
    edition_or_term: "2014 (repo carries the Stanford-distributed PDF stanford.pdf, plus errata)"
    access: free
    use: "Chapters on the basic Raft algorithm, cluster membership changes, log compaction and client interaction (linearizable semantics, exactly-once); skip the user study and evaluation chapters on a first pass."
    why: "Gap: the paper is terse on snapshots and client sessions; the thesis spells out log compaction and exactly-once client semantics needed for Lab 3D and Lab 4, and gives the membership-change algorithm that the lab skips."
    verified: true
  - id: paxos-simple
    role: reference
    kind: paper
    title: "Paxos Made Simple"
    by: "Leslie Lamport (2001)"
    url: https://lamport.azurewebsites.net/pubs/paxos-simple.pdf
    edition_or_term: "2001"
    access: free
    use: "Read after MIT Spring 2026 Lecture 4 and compare Paxos and Raft decision rules; write down why a proposer must adopt the highest-numbered accepted value."
    why: "Gap: Raft is easiest to learn after one pass over Paxos, and the node scope names Paxos explicitly."
    verified: true
  - id: jepsen-models
    role: reference
    kind: website
    title: "Jepsen: Consistency Models map"
    by: "Kyle Kingsbury (Jepsen)"
    url: https://jepsen.io/consistency/models
    edition_or_term: "Current"
    access: free
    use: "Read the pages for linearizable, sequential, causal, snapshot isolation and serializable, and the hierarchy diagram; skim Jepsen analyses (https://jepsen.io/analyses) for one real database."
    why: "Gap: precise, short definitions of consistency models with the implication graph, resolving the confusion between linearizability and serializability."
    verified: true
  - id: herlihy-wing
    role: reference
    kind: paper
    title: "Linearizability: A Correctness Condition for Concurrent Objects"
    by: "Maurice Herlihy, Jeannette Wing (TOPLAS 1990)"
    url: https://pdos.csail.mit.edu/6.824/papers/p463-herlihy.pdf
    edition_or_term: "1990"
    access: free
    use: "Sections 1-3.1 only (as assigned in MIT Spring 2026 Lecture 8, which has no public video)."
    why: "Gap: the primary definition of linearizability, which the node scope names; read after the Jepsen page."
    verified: true
  - id: bailis-lin-vs-ser
    role: secondary
    kind: article
    title: "Linearizability versus Serializability"
    by: "Peter Bailis"
    url: https://www.bailis.org/blog/linearizability-versus-serializability/
    edition_or_term: "2014"
    access: free
    use: "Read in full (5 minutes) together with Kleppmann's 'Please stop calling databases CP or AP' (https://martin.kleppmann.com/2015/05/11/please-stop-calling-databases-cp-or-ap.html)."
    why: "Gap: clears up the two most commonly confused guarantees and the misuse of CAP."
    verified: true
  - id: crdt
    role: secondary
    kind: paper
    title: "Conflict-free Replicated Data Types (CRDTs) and crdt.tech"
    by: "Nuno Preguica, Carlos Baquero, Marc Shapiro"
    url: https://arxiv.org/abs/1805.06358
    edition_or_term: "Encyclopedia of Big Data Technologies entry, 2018; resources at https://crdt.tech/"
    access: free
    use: "Read the 2018 overview (state-based vs operation-based CRDTs, G-Counter, PN-Counter, OR-Set, sequence CRDTs), then the crdt.tech resource list for implementations; implement a G-Counter and OR-Set."
    why: "Gap: the node scope includes CRDTs, which MIT's course does not cover; this is a short, authoritative entry point."
    verified: true
  - id: dslabs
    role: practice
    kind: tool
    title: "DSLabs: Distributed Systems Labs and Framework (Labs 2 and 3)"
    by: "Ellis Michael (University of Washington)"
    url: https://github.com/emichael/dslabs
    edition_or_term: "Current repository (used by UW CSE 452)"
    access: free
    use: "Lab 2 (primary-backup replication) and Lab 3 (Paxos), including the model checker and visual debugger; optional after MIT Lab 3."
    why: "Hidden gem: a message-passing framework with a model checker and visualizer that finds protocol bugs exhaustively, plus a Paxos lab that MIT's course does not have. Java based."
    verified: true
considered:
  - {title: "UW CSE 452 Distributed Systems", url: "https://courses.cs.washington.edu/courses/cse452/", reason: "Autumn 2026 term with DSLabs, lectures captured but enrolled-only; DSLabs used as practice instead."}
  - {title: "Database Internals, Part II (Petrov)", url: "https://www.databass.dev/", reason: "Clear chapters on failure detection, replication, consistency, consensus; used instead as primary text of the distributed-transactions node and the storage node."}
  - {title: "Distributed Systems, 4th edition (van Steen and Tanenbaum)", url: "https://www.distributed-systems.net/index.php/books/ds4/", reason: "Free and broad (Ch. 7 consistency and replication, Ch. 8 fault tolerance) but less rigorous and less practical than DDIA plus Raft."}
  - {title: "Brown CS 1380 (Spring 2026)", url: "https://cs.brown.edu/courses/csci1380/", reason: "Good project course but covers gossip and storage more than consensus."}
  - {title: "Building Distributed Systems: The Elector and The Consensus tracks", url: "https://builddistributedsystem.com/tracks", reason: "Could not assess depth or free access; MIT labs are the proven route."}
notes: "MIT 6.5840 is the center of gravity: do Lab 3 (Raft) with Figure 2 and the Ongaro thesis, then Lab 4. DDIA gives the vocabulary first (replication styles, consistency models, quorums), Kleppmann's notes give the formal view, and Jepsen is the precise reference for consistency models. CRDTs are not covered by MIT and come from the 2018 overview plus crdt.tech. Pair with formal-methods-for-systems to model-check a Raft or Paxos spec (soft prerequisite)."
split_proposal: "Consider splitting into (a) Replication and consistency models (DDIA ch. 6 and 10, Jepsen, CRDTs, quorums) and (b) Consensus protocols (Paxos, Raft, MIT labs 3-4); the Raft labs alone are 40+ hours."
prereq_changes: null
