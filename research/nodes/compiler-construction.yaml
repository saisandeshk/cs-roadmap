id: compiler-construction
title: Compiler Construction
group: G11
paths: [plc]
hard: [interpreters, computer-systems]
soft: [theory-of-computation]
scope: Front end, semantic analysis, IR, code generation, register allocation, runtime support.
level: intermediate
estimated_hours: 120
resources:
- {id: eac3, role: primary-text, kind: book, title: 'Engineering a Compiler, 3rd edition', by: 'Keith D. Cooper, Linda Torczon', url: 'https://shop.elsevier.com/books/engineering-a-compiler/cooper/978-0-12-815412-0', edition_or_term: '3rd edition (Morgan Kaufmann/Elsevier, Aug 2022); latest edition', access: paid, use: 'Ch. 1-3 (overview, scanners, parsers), 4 (intermediate representations), 5 (syntax-driven translation / semantic elaboration), 6 (implementing procedures: runtime support), 7 (code shape), 11 (instruction selection) and 13 (register allocation); skim 12 (instruction scheduling). Optimization chapters 8-10 belong to compiler-optimization.', why: 'Up to date (3rd edition, 2022, adds semantic elaboration, runtime support and code shape), pedagogically organized by compiler phase and the most balanced modern text between front end, IRs and back end. Winner of a 2024 TAA Textbook Excellence award per listings.', verified: true}
- id: stanford-cs143
  role: primary-course
  kind: course
  title: Stanford CS 143 Compilers
  by: Stanford (Alex Aiken et al.)
  url: https://web.stanford.edu/class/cs143/
  edition_or_term: Spring 2026
  access: free
  use: 'Course site: lecture slides (lexical analysis, parsing top-down/bottom-up, semantic analysis and type checking, runtime organization, code generation, operational semantics, optimization, register allocation, GC, JIT), the Cool Reference Manual, support code, written assignments with solutions and programming assignments PA1-PA5 (lexer, parser, semantic analyzer, code generator, optimizer).'
  why: 'The classic compiler project course: one language (COOL), a full compiler front end and MIPS code generator, with public handouts, written assignments and exam solutions. No official public videos: Stanford''s own recordings are not public; unofficial copies of Aiken''s older MOOC lectures circulate but are not linked here.'
  verified: true
  course: {latest_term: Spring 2026 (midterm and final 2026 posted), latest_url: 'https://web.stanford.edu/class/cs143/', videos: none, public_videos_term: none official (only unofficial copies of Aiken's 2013-14 Coursera/Lagunita lectures exist), assignments: public, assignments_url: 'https://web.stanford.edu/class/cs143/'}
- {id: sandler-wacc, role: secondary, kind: book, title: 'Writing a C Compiler: Build a Real Programming Language from Scratch', by: Nora Sandler, url: 'https://nostarch.com/writing-c-compiler', edition_or_term: 'No Starch Press, July 2024, 792 pp.; print comes with free ebook', access: paid, use: 'Work through the chapters in order (integers, unary operators, binary operators, logical/relational, local variables, if, compound statements, loops, functions, file scope, types and extra credit) writing a compiler to x64/ARM64 assembly in any language; run the book''s test suite at each stage.', why: 'The most practical incremental text on building a real compiler (to assembly, no parser-generator hand-waving), with a ready test suite; perfect companion to the theory in EaC.', verified: true}
- {id: wacc-tests, role: practice, kind: tool, title: writing-a-c-compiler-tests, by: Nora Sandler, url: 'https://github.com/nlsandler/writing-a-c-compiler-tests', edition_or_term: 'Rolling repository (244 commits; Python 3.8+ test driver, needs gcc)', access: free, use: 'Run ''./test_compiler ~/mycc --chapter N'' after each chapter, with the optional extra-credit flags (bitwise, compound assignment, etc.).', why: Public tests with valid/invalid programs make the book self-grading; the closest thing to an autograder for a self-built compiler., verified: true}
- {id: essentials-of-compilation, role: secondary, kind: book, title: 'Essentials of Compilation: An Incremental Approach (Racket or Python edition)', by: Jeremy G. Siek, url: 'https://github.com/IUCompilerCourse/Essentials-of-Compilation', edition_or_term: MIT Press (Racket 2021; Python 2023); LaTeX sources on GitHub, access: mixed, use: 'Chapters on compiling a language subset to x86-64 in small passes: integers and variables, register allocation (liveness, interference graphs, graph colouring), conditionals, loops, tuples with garbage collection, functions, lexical scope/closures, dynamic typing; use the public student support code for each language.', why: 'Short, nanopass-style incremental approach with register allocation and GC covered concretely; the paper copy is MIT Press, while free PDFs are claimed by the author (not verified here). Test suite is available to instructors on request.', verified: true}
