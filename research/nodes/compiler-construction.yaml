notes: 'Route (about 120 h): EaC ch. 1-7, 11, 13 for theory with either Stanford CS 143 (Cool; PA1-PA5; uses flex/bison/C++ or Java) or Sandler''s book plus tests (C subset to real x86-64/ARM) as the build; Essentials of Compilation or CMU 15-411 notes as second angles on register allocation and SSA. Stanford CS 143 has no official public videos (the earlier archive.org link was an unofficial mirror and was removed after review R2). Crafting Interpreters Part III (the single-pass bytecode compiler) is assigned in interpreters and Compiler Explorer in compiler-optimization, so both were removed here to avoid duplication. If forced to choose one build, Sandler''s book is closer to current practice; CS 143 is closer to a classroom course with exam solutions. This node needs the interpreters node as hard prereq; compiler-optimization continues with SSA, dataflow and LLVM. Runtime support (calling conventions, GC) is partly treated in EaC ch. 6 and in language-runtimes.'
split_proposal: Consider a split into 'compiler front end' (lexing, parsing, semantic analysis) and 'compiler back end' (IR, codegen, register allocation) because 120 h is heavy and CMU 15-411 teaches the back end first.
prereq_changes: null
open_questions: [Essentials of Compilation free-PDF availability (author site) and the MIT Press page were not verifiable (publisher blocks scripts; GitHub repo only builds the PDF from source)., CS 143 official recording status for Spring 2026 not stated on the course site; marked none. The site was opened over plain HTTP (HTTPS fetch from this sandbox fails/503); term inferred from 'Midterm 2026' and 'Final 2026' handouts; the syllabus page still shows stale 2021 dates., UW CSE 401 Spring 2026 lecture video availability unknown.]
