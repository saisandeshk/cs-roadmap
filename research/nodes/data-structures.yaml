id: data-structures
title: Data Structures
group: G1
paths:
- core
hard:
- python-programming
soft:
- dev-environment
scope: Lists, stacks/queues, trees, balanced BSTs, heaps, hash tables, graph representations, asymptotic basics; programming at scale (CS 61B-style).
level: intro
resources:
- id: cs61b-textbook
  role: primary-text
  kind: website
  title: CS 61B Textbook (Fall 2026 edition)
  by: Josh Hug and contributors (UC Berkeley)
  url: https://cs61b-2.gitbook.io/cs61b-textbook-fall-2026/1.-introduction
  edition_or_term: Fall 2026 edition (Spring 2026 edition also online)
  access: free
  use: Ch. 1-8 (Java, lists, arrays, ArrayList), 9-11 (inheritance, iterators, Comparables), 12-14 (asymptotics), 15 (disjoint sets), 16-19 (BSTs, B-trees, red-black trees, heaps), 20-24 (graph traversals, shortest paths, MST, DAGs), 25-27 (hashing, tries). Sorting chapters 30-34 overlap the algorithms node.
  why: A modern, free text written to the lecture sequence and tuned to build data structures from scratch with clear pictures and runnable Java; it covers every scope item (lists, trees, balanced BSTs, heaps, hashing, graphs, asymptotics).
  verified: true
- id: cs61b
  role: primary-course
  kind: course
  title: CS 61B Data Structures and Algorithms
  by: UC Berkeley (Josh Hug, Kay Ousterhout)
  url: https://fa26.datastructur.es/
  edition_or_term: Fall 2026 (currently running; Spring 2026 complete)
  access: free
  use: Lectures 1-28 (Java through hashing and tries) with labs 1-7, 9-10 (e.g. Lab 6 Disjoint Sets, Lab 7 Timing Experiments, Lab 9 Graphs, Lab 10 Shortest Paths), homeworks HW3 IntLists, HW5 BSTMap, HW7 HashMap; skip the sorting/compression lectures (G3) and BYOW project.
  why: 'The reference course for programming at scale: data structure invariants, testing, Java generics, design docs, with fully public lecture videos, slides, textbook and assignment writeups.'
  verified: true
  course:
    latest_term: Fall 2026
    latest_url: https://fa26.datastructur.es/
    videos: public
    public_videos_term: Spring 2026 (complete run; Fall 2026 lecture videos are also being posted on YouTube)
    public_videos_url: https://www.youtube.com/playlist?list=PL8FaHk7qbOD44fDmItR1wrkor8XdfUXC6
    assignments: partial
    assignments_url: https://fa26.datastructur.es/projects/proj2/
- id: cs61b-projects
  role: practice
  kind: website
  title: 'CS 61B assignments: deques, BSTMap, HashMap, Percolation, NGrams/WordNet'
  by: UC Berkeley CS 61B
  url: https://fa26.datastructur.es/projects/proj2/
  edition_or_term: Fall 2026 (same specs in Spring 2026 at https://sp26.datastructur.es/projects/proj2/)
  access: free
  use: Project 1B LinkedListDeque, Project 2 ArrayDeque61B (resizing, 11 tasks incl. writing tests), HW5 BSTMap, HW7 HashMap, Project 3 Percolation (union-find), Project 4A NGrams and 4B-4D Wordnet (graphs, https://sp26.datastructur.es/proj4/proj4a/); build each against the spec and write your own JUnit tests.
  why: Real design-and-implement assignments with tests; starter code is distributed via the course skeleton repo and grading via Gradescope (enrolled only), so write the tests yourself to self-check.
  verified: true
- id: java-for-python
  role: secondary
  kind: book
  title: Java for Python Programmers (3rd edition)
  by: Brad Miller; James Riely (DePaul edition)
  url: https://fpl.cs.depaul.edu/jriely/java4python/java4python.preface.html
  edition_or_term: 3rd edition (DePaul, CC BY 3.0)
  access: free
  use: Whole book in week 1 (getting started, data types, conditionals, loops, defining classes, common mistakes), together with 61B textbook ch. 1-2, HW2 Java Intro and Labs 1-3.
  why: Bridges the Python-first learner into the Java used by 61B, a cost the node otherwise leaves implicit.
  verified: true
- id: mit-6006-python-route
  role: secondary
  kind: course
  title: MIT 6.006 Introduction to Algorithms, data-structure lectures (Python route)
  by: MIT OpenCourseWare (Demaine, Ku, Solomon)
  url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
  edition_or_term: Spring 2020 (OCW)
  access: free
  use: 'Python-native alternative to the Java 61B route: Lectures 2 (Data Structures and Dynamic Arrays), 4 (Hashing), 6-7 (Binary Trees, AVL), 8 (Binary Heaps), 9-10 (BFS, DFS) with Problem Sets 1-3 (Python.py templates). If this route is taken, do it here and continue 6.006 from lecture 11 in the algorithms node instead of repeating.'
  why: Keeps the learner in Python with public videos and Python problem-set templates; less implementation volume and testing discipline than 61B, so 61B stays primary.
  verified: true
  course:
    latest_term: Spring 2020 (OCW)
    latest_url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    videos: public
    assignments: public
    assignments_url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/pages/assignments/
- id: algs4
  role: secondary
  kind: book
  title: Algorithms, 4th edition (booksite)
  by: Robert Sedgewick, Kevin Wayne
  url: https://algs4.cs.princeton.edu/home/
  edition_or_term: 4th edition (2011); Coursera Algorithms Part I and II
  access: mixed
  use: Sections 1.3 Stacks and Queues, 1.4 Analysis of Algorithms, 1.5 Union-Find, 2.4 Priority Queues, 3.1-3.5 Symbol Tables/BSTs/Balanced Trees/Hash Tables, 4.1-4.2 Graphs; the booksite has free code and lecture slides, and the Coursera courses (https://www.coursera.org/learn/algorithms-part1) have public video lectures.
  why: A second, differently-voiced treatment with rigorous cost analysis and clean Java reference implementations; useful when a 61B explanation does not click.
  verified: true
- id: open-data-structures
  role: secondary
  kind: book
  title: Open Data Structures
  by: Pat Morin
  url: https://opendatastructures.org/
  edition_or_term: Online edition (Java, C++ and pseudocode versions)
  access: free
  use: Chapters on array-based lists, linked lists, hash tables, binary search trees, heaps, graphs, and B-trees for the provable-running-time proofs; read the proof of amortized resizing and the hash-table analysis.
  why: Adds the amortised/probabilistic analysis that 61B states but does not prove; available in C++ as well as Java (useful for a C/C++ learner).
  verified: true
- id: ds-visualizations
  role: secondary
  kind: tool
  title: VisuAlgo
  by: Steven Halim
  url: https://visualgo.net/en
  edition_or_term: Online tools
  access: free
  use: Step through linked list, BST/AVL, heap, hash table, union-find and graph traversal visualisations with your own inputs before coding each structure.
  why: Fills the gap of seeing pointer/array states evolve; good for debugging mental models.
  verified: true
- id: cos226-assignments
  role: practice
  kind: website
  title: Princeton COS 226 programming assignments
  by: Princeton University
  url: https://www.cs.princeton.edu/courses/archive/spring26/cos226/assignments.php
  edition_or_term: Spring 2026
  access: free
  use: 'Assignment specs: Percolation, Queues (deque and randomized queue with arrays and linked lists), Autocomplete, K-d Trees, WordNet; follow each checklist.'
  why: Second set of well-specified, performance-checked Java projects; the specs include testing and time/memory requirements, complementing 61B.
  verified: true
- id: cses-ds
  role: practice
  kind: practice-site
  title: CSES Problem Set (Sorting and Searching, Graph Algorithms)
  by: Antti Laaksonen
  url: https://cses.fi/problemset/list/
  edition_or_term: Living
  access: free
  use: 'Sorting and Searching: Distinct Numbers, Apartments, Ferris Wheel, Concert Tickets, Playlist, Sliding Window Median, Traffic Lights; Graph Algorithms: Counting Rooms, Labyrinth, Message Route, Building Roads; solve with your own implementations.'
  why: Autograded problems that force the right data structure (multiset, heap, queue, union-find) under time limits; link to algorithms node.
  verified: true
considered:
- title: Princeton COS 226 (Spring 2026) / Coursera Algorithms Parts I-II
  url: https://www.cs.princeton.edu/courses/archive/spring26/cos226/
  reason: Excellent, but the 2026 run does not post lecture videos (Videos link commented out); public Coursera lectures are older. Better placed in the algorithms node as a parallel track.
- title: CMU 15-122 Principles of Imperative Computation
  url: https://www.cs.cmu.edu/~15122/
  reason: Strong specification-first data structures course using C0/C; language is nonstandard and videos not public; kept out.
- title: Problem Solving with Algorithms and Data Structures using Python (Runestone)
  url: https://runestone.academy/ns/books/published/pythonds3/index.html
  reason: Python-native alternative if Java is unwanted; blocked to automated fetch so not verified.
- title: Stanford CS 106B/X Programming Abstractions in C++
  url: https://web.stanford.edu/class/cs106b/
  reason: C++ route with public older videos; not reachable for verification.
- title: MIT 6.006 Introduction to Algorithms
  url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
  reason: Algorithms node (G3); assumes data structures; includes a data-structures sequence (sequences, sets, hashing, heaps) that complements this node.
- title: Think Data Structures (Allen Downey)
  url: https://greenteapress.com/wp/think-data-structures/
  reason: Short Java text, implementation-oriented; older, covered by 61B textbook.
- title: OpenDSA (Virginia Tech)
  url: https://opendsa-server.cs.vt.edu/
  reason: Interactive visualized textbook with exercises; unclear editions, but a good practice alternative.
- title: DSA Handbook and AlgoMaster (owner seeds)
  url: https://dsa.handbook.academy/curriculum/
  reason: Interview-oriented platforms from the owner earlier curation; good for tagging drills but not a canonical primary.
- title: USF Data Structure Visualizations (David Galles)
  url: https://www.cs.usfca.edu/~galles/visualization/Algorithms.html
  reason: Good older visualizer; VisuAlgo covers the same structures, so one visualization entry is kept.
notes: 'CS 61B is Java. A Python-only learner has to pick up Java syntax in lectures 1-4 (labs 1-3), which is manageable because 61A already supplied the abstractions, and the Java static typing is itself part of the payoff (generics, interfaces). Java bridge: java-for-python. Python-native alternative route: the 6.006 data-structure lectures with Python problem sets (mit-6006-python-route), then re-implement the 61B projects in Python with pytest; Open Data Structures is Java/C++/pseudocode, not Python, and Runestone pythonds3 stays in considered because it could not be opened. The Fall 2026 run is mid-semester (Week 12 of the course), with video links per lecture; the Spring 2026 playlist is the complete reference run. Sorting, algorithmic bounds, radix sorts and compression overlap algorithms (G3) and are intentionally excluded here. Software-engineering lectures (design docs, BYOW) feed software-construction. Review update (2026-11-19): the reviewer flagged overlap with the algorithms node (Percolation, COS 226 queues, CSES lists, algs4, VisuAlgo); that node belongs to G3, so per coordinator instruction cross-group overlaps are left for the owner.'
