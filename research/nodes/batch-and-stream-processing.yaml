id: batch-and-stream-processing
title: Batch & Stream Processing
group: G10
paths: [distributed, databases]
hard: [distributed-systems-fundamentals]
soft: []
scope: "MapReduce/Spark, dataflow, log-based messaging (Kafka), stream processing semantics, exactly-once."

level: intermediate
estimated_hours: 60
resources:
  - id: ddia2-batch-stream
    role: primary-text
    kind: book
    title: "Designing Data-Intensive Applications, 2nd edition: Batch Processing and Stream Processing chapters"
    by: "Martin Kleppmann, Chris Riccomini"
    url: https://dataintensive.net/
    edition_or_term: "2nd edition (O'Reilly, March 2026, 670 pages)"
    access: paid
    use: "Chapter 11 'Batch Processing' (Unix tools, MapReduce, dataflow engines like Spark, joins and shuffles, fault tolerance) Chapter 12 'Stream Processing' (message brokers vs logs, change data capture, event sourcing, event time and windows, stream joins, fault tolerance and exactly-once, idempotence) and Chapter 13 'A Philosophy of Streaming Systems' (derived data, unbundling databases, end-to-end correctness; chapter titles confirmed from O'Reilly previews)."
    why: "Covers the whole scope in one coherent argument (logs as the unifying abstraction, batch and stream as the same dataflow problem), is current to 2026, and is the best prerequisite for reading Kafka and Flink docs."
    verified: true
  - id: cs451
    role: primary-course
    kind: course
    title: "Waterloo CS 451/651: Data-Intensive Distributed Computing"
    by: "Jimmy Lin (University of Waterloo)"
    url: https://lintool.github.io/cs451-2025f/
    edition_or_term: "Fall 2025"
    access: free
    use: "Syllabus weeks 2-4 (data lakes/lakehouses, Batch Processing I and II incl. Spark), 12 (graph processing), 13 (Stream Processing); assignments A1 to A6 (PySpark RDDs and DataFrames, DuckDB, SSSP) from the public assignment pages; slides are public PDFs."
    why: "The newest public run found (Fall 2025) of a course that pairs Spark programming with the same DDIA 2nd-edition readings; assignments are public but run through GitHub Classroom for enrolled students only. It treats streaming briefly, so pair it with the Flink and Kafka resources below. No lecture videos found."
    verified: true
    course:
      latest_term: "Fall 2025"
      latest_url: https://lintool.github.io/cs451-2025f/
      videos: none
      assignments: public
      assignments_url: https://lintool.github.io/cs451-2025f/assignments.html
  - id: streaming-systems
    role: secondary
    kind: book
    title: "Streaming Systems: The What, Where, When, and How of Large-Scale Data Processing"
    by: "Tyler Akidau, Slava Chernyak, Reuven Lax"
    url: https://www.oreilly.com/library/view/streaming-systems/9781491983867/
    edition_or_term: "O'Reilly, 2018"
    access: paid
    use: "Ch. 1-2 (event time vs processing time, windowing), Ch. 3 (watermarks), Ch. 4 (advanced windowing and triggers), Ch. 5 (exactly-once and side effects), Ch. 6 (streams and tables), later chapters on state and joins as needed."
    why: "Gap: DDIA treats stream semantics in a few pages; this is the definitive deep treatment of event time, watermarks and triggers by the Dataflow/Beam authors. Free taster: the two Streaming 101 and 102 articles that the book expands. Authors' page (http only, opens): http://streamingsystems.net/."
    verified: false
  - id: streaming-101
    role: secondary
    kind: article
    title: "The world beyond batch: Streaming 101 and Streaming 102"
    by: "Tyler Akidau (O'Reilly Radar, 2015)"
    url: https://www.oreilly.com/ideas/the-world-beyond-batch-streaming-101
    edition_or_term: "2015; second part at https://www.oreilly.com/ideas/the-world-beyond-batch-streaming-102"
    access: free
    use: "Read both in full before the Flink time-concepts page."
    why: "Gap: the free precursor of the book and still the clearest explanation of windows, watermarks, triggers and accumulation modes."
    verified: true
  - id: kafka-docs
    role: secondary
    kind: docs
    title: "Apache Kafka 4.3 documentation: Design (log, replication, consumer groups, transactions)"
    by: "Apache Software Foundation"
    url: https://kafka.apache.org/43/design/design/
    edition_or_term: "Kafka 4.3"
    access: free
    use: "Read Design (motivation, persistence, efficiency, the producer/consumer, message delivery semantics, replication) plus the Consumer Rebalance Protocol and Transaction Protocol pages; run the quickstart (https://kafka.apache.org/quickstart)."
    why: "Gap: the authoritative description of log-based messaging and Kafka's exactly-once (idempotent producers and transactions); the confluent 'Kafka 101' course (https://developer.confluent.io/courses/apache-kafka/events/) gives a gentler entry."
    verified: true
  - id: flink-docs
    role: secondary
    kind: docs
    title: "Apache Flink 2.3: Learn Flink and Concepts (stateful and timely stream processing)"
    by: "Apache Software Foundation"
    url: https://nightlies.apache.org/flink/flink-docs-release-2.3/docs/concepts/stateful-stream-processing/
    edition_or_term: "Flink 2.3"
    access: free
    use: "Concepts: Stateful Stream Processing (checkpoints, barriers, exactly-once), Timely Stream Processing; Learn Flink: Streaming Analytics, Data Pipelines and ETL, Event-driven Applications, Fault Tolerance (hands-on exercises)."
    why: "Gap: the reference implementation of event-time, state and checkpoint-based exactly-once; the Learn Flink section has runnable exercises."
    verified: true
  - id: spark-docs
    role: reference
    kind: docs
    title: "Apache Spark 4.3: Structured Streaming Programming Guide and RDD Programming Guide"
    by: "Apache Software Foundation"
    url: https://spark.apache.org/docs/latest/structured-streaming-programming-guide.html
    edition_or_term: "Spark 4.3.0"
    access: free
    use: "RDD Programming Guide (https://spark.apache.org/docs/latest/rdd-programming-guide.html) for the batch model; Structured Streaming guide for micro-batch/continuous modes, watermarks and sinks."
    why: "Gap: the dominant batch engine and its streaming API; lets you compare Spark's model with Flink's."
    verified: true
  - id: spark-rdd-paper
    role: reference
    kind: paper
    title: "Resilient Distributed Datasets: A Fault-Tolerant Abstraction for In-Memory Cluster Computing"
    by: "Matei Zaharia et al. (NSDI 2012)"
    url: https://www.usenix.org/system/files/conference/nsdi12/nsdi12-final138.pdf
    edition_or_term: "NSDI 2012"
    access: free
    use: "Sections 1-4 (RDD model, lineage-based fault tolerance, narrow vs wide dependencies); read after the MapReduce paper in the fundamentals node."
    why: "Gap: explains why dataflow engines replaced MapReduce and how lineage replaces replication."
    verified: true
  - id: dataflow-model
    role: reference
    kind: paper
    title: "The Dataflow Model: A Practical Approach to Balancing Correctness, Latency, and Cost in Massive-Scale, Unbounded, Out-of-Order Data Processing"
    by: "Tyler Akidau et al. (VLDB 2015)"
    url: https://static.googleusercontent.com/media/research.google.com/en//pubs/archive/43864.pdf
    edition_or_term: "VLDB 2015"
    access: free
    use: "Read Sections 1-3 (what/where/when/how model) after Streaming 102."
    why: "Gap: the formal model behind Beam and Flink's event-time design."
    verified: true
  - id: flink-snapshots
    role: reference
    kind: paper
    title: "Lightweight Asynchronous Snapshots for Distributed Dataflows"
    by: "Paris Carbone et al. (2015)"
    url: https://arxiv.org/abs/1506.08603
    edition_or_term: "arXiv 2015"
    access: free
    use: "Read the barrier-based snapshot algorithm (adapts Chandy-Lamport, whose paper is at https://lamport.azurewebsites.net/pubs/chandy.pdf) after the Flink stateful-processing page."
    why: "Gap: the algorithm behind Flink's exactly-once state guarantees, connecting back to global snapshots from the fundamentals node."
    verified: true
  - id: kafka-paper
    role: reference
    kind: paper
    title: "Kafka: a Distributed Messaging System for Log Processing"
    by: "Jay Kreps, Neha Narkhede, Jun Rao (NetDB 2011)"
    url: https://notes.stephenholiday.com/Kafka.pdf
    edition_or_term: "2011 (third-party copy hosted at notes.stephenholiday.com)"
    access: free
    use: "Read in full (short) for the original design rationale: pull-based consumers, partitions, sequential I/O."
    why: "Gap: the original design paper; check the Kafka docs for current behaviour."
    verified: true
  - id: gossip-kafka
    role: practice
    kind: practice-site
    title: "Gossip Glomers: Challenge 5 Kafka-Style Log"
    by: "Fly.io and Kyle Kingsbury (Jepsen)"
    url: https://fly.io/dist-sys/5a/
    edition_or_term: "Current"
    access: free
    use: "Challenges #5a (single-node log), #5b (multi-node), #5c (efficient) with Maelstrom checks."
    why: "Gap: implement offsets, sends and polls of a replicated log yourself; makes the log abstraction concrete."
    verified: true
  - id: confluent-flink101
    role: practice
    kind: course
    title: "Confluent Developer: Apache Flink 101 and Flink SQL; Kafka Streams 101"
    by: "Confluent"
    url: https://developer.confluent.io/courses/apache-flink/intro/
    edition_or_term: "Current free video courses with hands-on exercises"
    access: free
    use: "Apache Flink 101 (about 10 short videos), then Flink SQL, then Kafka Streams 101 (https://developer.confluent.io/courses/kafka-streams/get-started/); do the exercises that build windowed aggregations and joins."
    why: "Gap: short video modules with runnable exercises for Flink and Kafka Streams. Vendor material, so cross-check concepts against the Apache docs."
    verified: true
    course:
      latest_term: "Rolling (self-paced)"
      latest_url: https://developer.confluent.io/courses/
      videos: public
      assignments: public
      assignments_url: https://developer.confluent.io/courses/apache-flink/intro/
considered:
  - {title: "Brown CS 1380 Milestone M5: Distributed Processing", url: "https://cs.brown.edu/courses/csci1380/", reason: "A build-your-own MapReduce-style engine in JavaScript; good project but not a stream-processing treatment."}
  - {title: "Streaming Systems as the primary text", url: "https://www.oreilly.com/library/view/streaming-systems/9781491983867/", reason: "Unmatched on stream semantics but excludes batch/MapReduce/Spark and log-based messaging internals; DDIA plus this as secondary covers the full scope."}
  - {title: "Apache Beam programming guide", url: "https://beam.apache.org/documentation/programming-guide/", reason: "Portable model derived from Dataflow; useful once the Dataflow paper is read, but Flink and Spark docs are enough for a first pass."}
  - {title: "Confluent blog: Exactly-once semantics are possible", url: "https://www.confluent.io/blog/exactly-once-semantics-are-possible-heres-how-apache-kafka-does-it/", reason: "Good vendor explanation of idempotent producers and transactions; the Kafka docs pages cover the same."}
  - {title: "Jay Kreps, The Log (LinkedIn Engineering)", url: "https://engineering.linkedin.com/distributed-systems/log-what-every-software-engineer-should-know-about-real-time-datas-unifying", reason: "Classic essay on the log abstraction; the old URL returned 404 during verification, so it is not listed as a resource."}
notes: "No single strong public university course covers both batch and streaming: Waterloo CS 451/651 (Fall 2025) is the best public one for Spark and data-platform context, while Flink, Kafka and Streaming Systems cover streaming depth. Practice is Gossip Glomers #5 plus Confluent/Flink exercises and CS 451 assignments. Spark and Kafka docs are versioned (4.3), so re-check version numbers. CS 451/651 is a slides-and-assignments course (no lecture videos; two sections exist and only Section 002 material is public); the video track is the Confluent Flink 101, Flink SQL and Kafka Streams 101 courses listed under practice."
split_proposal: null
prereq_changes: "Add soft: [databases-intro] (SQL, joins) since Flink SQL, Spark SQL and stream-table duality assume it."
open_questions:
  - "DDIA 2nd edition: Ch. 11 'Batch Processing' was confirmed from a Waterloo syllabus; the exact numbers and titles of the stream-processing chapters (seed says Ch. 11-13) could not be confirmed since O'Reilly pages return 403."
  - "Streaming Systems: the authors' site (http://streamingsystems.net/) opened over plain HTTP only (HTTPS failed), and the O'Reilly book page returned 403 to my fetches, so the listed O'Reilly URL is confirmed only via search results (verified false)."
  - "CS 451/651 Fall 2025: I found no lecture recordings; the Section 001 instructor may have separate materials."
last_verified: 2026-11-18
