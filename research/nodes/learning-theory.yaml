# --- copied from research/skeleton.yaml ---
id: learning-theory
title: Learning Theory
group: G3
paths: [theory]
hard: [probability, ml-fundamentals]
soft: [optimization]
scope: "PAC learning, VC dimension, Rademacher complexity, online learning, generalization theory for deep learning."

# --- curation data ---
level: advanced
estimated_hours: 150
resources:
  - id: ssbd-understanding-ml
    role: primary-text
    kind: book
    title: "Understanding Machine Learning: From Theory to Algorithms"
    by: "Shai Shalev-Shwartz, Shai Ben-David"
    url: https://www.cambridge.org/core/books/understanding-machine-learning/3059695661405D25673058E43C8BE2A6
    edition_or_term: "Cambridge University Press 2014; free author PDF (huji.ac.il/~shais/UnderstandingMachineLearning; the site was blocked from this environment)"
    access: mixed
    use: "Part I: ch. 2-6 (PAC, agnostic PAC, uniform convergence, bias-complexity, VC dimension), 7-8 (non-uniform learnability, runtime); Part II: ch. 9 (linear predictors), 12-14 (convex learning, regularization and stability, SGD), 16 (kernels); Part III: ch. 21 (online learning), 26 (Rademacher complexity), 27 (covering numbers), 31 (PAC-Bayes); optionally 28 (proof of fundamental theorem). Exercises: at least 4 per chapter read; in particular prove unaided the sample complexity of finite hypothesis classes (ch. 2-4), the VC dimension of halfspaces and axis-aligned rectangles (ch. 6), the Rademacher bound for bounded-norm linear predictors (ch. 26) and the regret bound for online gradient descent (ch. 21). Chapter numbers are from memory of the printed edition and were not checked against the table of contents."
    why: "The standard rigorous introduction that matches the scope (PAC, VC, Rademacher, online); written as a book with exercises; free PDF from the authors. Does not cover overparameterized/deep generalization, hence Bach and Telgarsky below."
    verified: true
  - id: cs229m
    role: primary-course
    kind: course
    title: "Stanford STATS214 / CS229M Machine Learning Theory"
    by: "Stanford (Tengyu Ma 2021; Percy Liang earlier; Tselil Schramm Fall 2024)"
    url: https://tselilschramm.org/mltheory/stats214-fall24.html
    edition_or_term: "Fall 2024 page (instructor Schramm); public lecture videos are Fall 2021 (Tengyu Ma)"
    access: free
    use: "Lecture notes (Tengyu Ma 167 pp. PDF, Percy Liang notes) and the Fall 2021 YouTube playlist: ERM, asymptotics and uniform convergence, Rademacher complexity and generalization bounds, kernels and margin bounds, online learning, implicit regularization, deep-learning generalization (NTK, double descent, etc.). Read the schedule on the Fall 2024 page for readings."
    why: "Only public graduate course that goes from classical uniform convergence to modern deep-learning generalization, with lecture videos and typed notes. The recent term (Fall 2024) lists no public recordings or problem sets, so the 2021 videos plus the notes carry the load."
    verified: true
    course:
      latest_term: "Fall 2024 (Schramm); newer Stanford offerings not located"
      latest_url: https://tselilschramm.org/mltheory/stats214-fall24.html
      videos: none
      public_videos_term: "Fall 2021 (Tengyu Ma)"
      public_videos_url: https://www.youtube.com/playlist?list=PLoROMvodv4rP8nAmISxFINlGKSK4rbLKh
      assignments: unknown
  - id: bach-ltfp
    role: secondary
    kind: book
    title: "Learning Theory from First Principles"
    by: "Francis Bach"
    url: https://www.di.ens.fr/~fbach/ltfp_book.pdf
    edition_or_term: "MIT Press 2024; free author PDF (version dated May 26, 2025, about 470 pp.)"
    access: free
    use: "Ch. 4 (empirical risk minimization), 5 (optimization for ML), 7 (kernel methods), 9 (neural networks), 11 (from online learning to bandits), 12 (overparameterized models: implicit bias, double descent, lazy regime/NTK), 14.4 (PAC-Bayes), 15 (lower bounds). Read ch. 12 after the classical chapters of Shalev-Shwartz and Ben-David."
    why: "Gap: modern, unified treatment including overparameterized models, double descent and bandits missing in S-S&B; rigorous and self-contained; free PDF from the author."
    verified: true
  - id: mohri-fml
    role: secondary
    kind: book
    title: "Foundations of Machine Learning, 2nd edition"
    by: "Mehryar Mohri, Afshin Rostamizadeh, Ameet Talwalkar"
    url: https://cs.nyu.edu/~mohri/mlbook/
    edition_or_term: "MIT Press 2018 (official free PDF and HTML on the author page; lecture slides)"
    access: free
    use: "Chapters on PAC learning, Rademacher complexity and VC dimension, SVMs/margin theory, boosting, online learning, and the appendices on concentration inequalities; use the lecture slides as a quick overview."
    why: "Gap: cleaner Rademacher-complexity-first exposition than S-S&B, with extensive margin theory and an appendix of concentration tools; lecture slides provided."
    verified: true
  - id: hazan-oco
    role: secondary
    kind: book
    title: "Introduction to Online Convex Optimization"
    by: "Elad Hazan"
    url: https://arxiv.org/abs/1909.05207
    edition_or_term: "2nd edition (arXiv v5+; MIT Press 2022)"
    access: free
    use: "Ch. 1-4 (online learning basics, online gradient descent, regret minimization, strong convexity), 5 (regularization/FTRL), 6 (bandit convex optimization) for the online-learning unit; optional later chapters on boosting and game theory."
    why: "Gap: the online learning portion of the scope gets only a chapter in S-S&B; Hazan is the compact standard reference for regret analysis, FTRL and mirror descent ideas."
    verified: true
  - id: telgarsky-dlt
    role: secondary
    kind: website
    title: "Deep learning theory lecture notes"
    by: "Matus Telgarsky"
    url: https://mjt.cs.illinois.edu/dlt/
    edition_or_term: "Alpha version v0.0 (2021-10-27); site live"
    access: free
    use: "Approximation (universal approximation, Barron norm, benefits of depth), optimization (convex optimization, NTK proofs, nonsmoothness), and generalization chapters (Rademacher and covering bounds for networks)."
    why: "Gap: the generalization-for-deep-learning unit needs a theorem-proof treatment of what neural nets can represent, optimize and generalize; these notes provide clean, focused proofs."
    verified: true
  - id: bmr-statistical-viewpoint
    role: reference
    kind: paper
    title: "Deep learning: a statistical viewpoint"
    by: "Peter L. Bartlett, Andrea Montanari, Alexander Rakhlin"
    url: https://arxiv.org/abs/2103.09177
    edition_or_term: "Acta Numerica 2021 (arXiv 2103.09177)"
    access: free
    use: "Read the sections on benign overfitting, implicit regularization and interpolation to see how the classical bounds are rethought for overparameterized models."
    why: "Gap: the 30-page survey that connects classical bounds to modern phenomena; a good capstone reading."
    verified: true
  - id: vershynin-hdp
    role: reference
    kind: book
    title: "High-Dimensional Probability: An Introduction with Applications in Data Science"
    by: "Roman Vershynin"
    url: https://webapps.math.uci.edu/~rvershyn/papers/HDP-book/HDP-book.html
    edition_or_term: "Cambridge University Press 2018 (free author version)"
    access: free
    use: "Sub-Gaussian and sub-exponential tails, concentration inequalities, covering numbers, chaining and generic chaining, VC dimension, Rademacher symmetrization: look up the technique when a proof calls it."
    why: "Gap: the probability toolbox behind uniform convergence and Rademacher bounds, in textbook form with exercises."
    verified: true
