notes: "Free author PDF of S-S&B (unverified, site blocked from this environment): https://www.cs.huji.ac.il/~shais/UnderstandingMachineLearning/understanding-machine-learning-theory-algorithms.pdf. Primary pairing: Shalev-Shwartz & Ben-David for classical PAC/VC/Rademacher/online, with CS229M (2021 videos and 2022 notes) as the course and Bach plus Telgarsky as the modern/deep-learning extension. The newest public lecture recordings I confirmed are Fall 2021 (CS229M); KAIST EE531 Spring 2026 playlist exists but has only 17 videos (per review R1), so it is not a primary-course candidate. Scope's 'generalization theory for deep learning' has no single text: use Bach ch. 12, Telgarsky and the Bartlett-Montanari-Rakhlin survey. 150 hours assume the classical core in depth and DL theory at survey depth."
split_proposal: "Possible split into 'Statistical Learning Theory' (PAC, VC, Rademacher, online) and 'Theory of Deep Learning' (approximation, optimization, generalization of overparameterized nets, NTK), since the latter is a research-level topic."
prereq_changes: "Add soft: [linear-algebra] and soft: [algorithm-design] (for the NP-hardness of learning and boosting sections); optimization is already soft."
