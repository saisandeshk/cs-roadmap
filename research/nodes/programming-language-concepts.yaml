- {id: beautiful-racket, role: secondary, kind: book, title: Beautiful Racket, by: Matthew Butterick, url: 'https://beautifulracket.com/', edition_or_term: Online book (checked 2026-11-18), access: free, use: 'Optional: the first chapters and one small language implementation (e.g. a stack-based or Basic-like language) to see how Racket''s macro and module system implements languages.', why: 'A gentle, project-driven introduction to implementing little languages in Racket for learners who find PLAI''s pace abrupt.', verified: true}
- {id: sicp, role: secondary, kind: book, title: Structure and Interpretation of Computer Programs (JavaScript edition and Scheme original), by: 'Harold Abelson, Gerald Jay Sussman, Julie Sussman', url: 'https://mitp-content-server.mit.edu/books/content/sectbyfn/books_pres_0/6515/sicp.zip/index.html', edition_or_term: 'Scheme edition (MIT Press 1996, free online); JavaScript edition (2022)', access: free, use: 'Ch. 1-3 (procedures, data abstraction, state, streams) for the conceptual core; ch. 4 (metacircular evaluator, lazy evaluation) is the bridge to the interpreters node.', why: 'A classic whose lessons on abstraction and evaluation models underlie the whole node; included as an alternative primary text for readers who prefer a longer, more programming-heavy approach.', verified: true}
considered:
- {title: 'Essentials of Programming Languages (Friedman and Wand), 3rd edition', url: 'https://www.eopl3.com/', reason: Another interpreter-based PL text; more terse and Scheme-only than PLAI. Page not opened.}
- {title: 'Concepts, Techniques, and Models of Computer Programming (Van Roy and Haridi)', url: 'https://www.info.ucl.ac.be/~pvr/book.html', reason: Encyclopedic paradigm survey; too large for this node. Page not opened.}
- {title: 'Programming Language Pragmatics (Scott), 4th ed.', url: 'https://www.elsevier.com/', reason: Survey-style text; less hands-on than the interpreter approach; publisher page not opened.}
- {title: Stanford CS 242 Programming Languages, url: 'https://web.stanford.edu/class/cs242/', reason: Rust-based PL course; not examined for this pass (listed in csdiy.wiki).}
- {title: Cornell CS 3110 (course assignments), url: 'https://www.cs.cornell.edu/courses/cs3110/2025fa/', reason: Textbook and videos are public (used above); problem sets and the full syllabus are in Canvas only.}
notes: 'Route (about 70 h): SMoL Tutor (3 h), then either Grossman''s Parts A-C (about 45 h; includes SML, Racket, Ruby) or PLAI chapters with interpreters (about 45 h), plus CS 3110''s book for a typed-functional language if you want OCaml. Because the node''s hard prereq is python-programming only, a typed functional language is new to most learners; choose one of SML/OCaml/Racket and stick with it. ''Modules'' is best covered in SML/OCaml (Grossman Part A, CS 3110); ''evaluation strategies'' in Grossman Part B and PLAI laziness chapters. Compare with interpreters (node 2) which then builds the full tree-walking and bytecode interpreters.'
split_proposal: null
prereq_changes: Consider adding soft prereq discrete-math (induction and recursion), and note that type-systems already hard-requires this node plus discrete-math.
open_questions: ['Whether Coursera''s Programming Languages Part A-C lecture videos can be watched free (audit) in 2026 could not be confirmed; marked videos: unknown. Verify before making Grossman the sole primary.', Brown CSCI 1730 recordings are on Panopto (not opened; assumed Brown-login)., Essentials of Programming Languages and CTM pages were not opened.]
