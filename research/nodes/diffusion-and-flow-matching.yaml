notes: "Three layers of material are provided: (1) 6.S184 text+course+labs for the unified flow/diffusion view, (2) CMU 10799 for implementation, solvers and distillation, (3) blogs and papers for intuition and primary sources. The node is dense; 55 hours assumes 6.S184 + labs (about 25 h), CMU HW1-2 (about 15 h) and reading (15 h). Discrete diffusion (masked/absorbing) is only touched (6.S184 lecture 5, CMU lectures 12-13)."
split_proposal: null
prereq_changes: "6.S184 itself states prerequisites as probability theory + deep learning (+ linear algebra/real analysis), not generative-modeling-foundations. Consider hard: [deep-learning-fundamentals, probability] with generative-modeling-foundations as soft (VAEs only needed for latent diffusion). Also stochastic calculus basics (SDEs, Fokker-Planck) are taught inside the notes, so no new prereq is needed."
