considered:
  - {title: "Stanford CME296 Diffusion & Large Vision Models (Amidi twins, Spring 2026)", url: "https://cme296.stanford.edu/", reason: "Public YouTube lectures (diffusion, score matching, flow matching, latent+guidance, architectures, training, evaluation, trends) but no homework, exams only. Chosen instead as primary course of generative-models-at-scale."}
  - {title: "Stanford CS236 Deep Generative Models (Fall 2023)", url: "https://cs236.stanford.edu/", reason: "Excellent VAE/EBM/score foundations (used in generative-modeling-foundations); its diffusion coverage predates flow matching."}
  - {title: "KAIST CS492(C) Diffusion and Flow Models (Minhyuk Sung, Fall 2025)", url: "https://diffusion.kaist.ac.kr/", reason: "Strong 2025 course with YouTube playlist per cs-video-courses (my oembed check on that playlist returned no title, so unconfirmed) and public programming assignments; page opened but not evaluated in detail. A good second opinion."}
  - {title: "MIT 6.8300 / 6.S978 diffusion lectures", url: "https://scenerepresentations.org/courses/2026/spring/advances-in-cv/", reason: "Diffusion 1-3 lectures in 6.8300 are good but embedded in a broad vision course."}
  - {title: "CS 6785/NYCU/UT Austin/IIT diffusion courses listed on cs-video-courses", url: "https://www.youtube.com/playlist?list=PL8lIiiIWuabLxhJreBRZwNW-d02dJwbMb", reason: "Public playlists (e.g. UT Austin) not evaluated."}
