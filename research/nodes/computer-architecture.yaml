id: computer-architecture
title: "Computer Architecture (organization)"
group: G4
paths: [core, architecture]
hard: [computer-systems]
soft: [digital-logic]
scope: "ISA (RISC-V), assembly, datapath and control, pipelining and hazards, caches, VM hardware, SIMD and multicore basics."

level: intermediate
estimated_hours: 110
resources:
  - id: pnh-riscv
    role: primary-text
    kind: book
    title: "Computer Organization and Design RISC-V Edition: The Hardware/Software Interface, 2nd edition"
    by: "David A. Patterson, John L. Hennessy"
    url: https://shop.elsevier.com/books/computer-organization-and-design-risc-v-edition/patterson/978-0-12-820331-6
    edition_or_term: "2nd edition (Elsevier, Dec 2020), latest edition"
    access: paid
    use: "Ch. 1 (performance), 2 (RISC-V ISA), 3 (arithmetic), 4 (the processor: single-cycle datapath, pipelining, hazards), 5 (memory hierarchy, caches, virtual memory), 6 (parallel processors: SIMD, multicore). Skip the GPU/cloud boxes on a first pass."
    why: "The standard hardware/software-interface text, now in RISC-V, matches the course below (CS 61C) and the node scope almost line for line."
    verified: true
  - id: cs61c
    role: primary-course
    kind: course
    title: "UC Berkeley CS 61C Great Ideas in Computer Architecture (Machine Structures)"
    by: "Berkeley EECS (Dan Garcia, Lisa Yan, et al.)"
    url: https://cs61c.org/
    edition_or_term: "Fall 2026 (Dan Garcia)"
    access: mixed
    use: "Follow the Fall 2026 calendar and labs/projects: Labs 3-4 (RISC-V, calling convention), Lab 5 (Logisim), Lab 6 (CPU, pipelining), Lab 7 (parallelism: SIMD/OpenMP); Projects 2 (CS61Classify, RISC-V assembly) and 3 (CS61CPU, build a pipelined RISC-V CPU). Use the 2020 recordings or course notes for lecture content."
    why: "Takes a C programmer through RISC-V assembly, a CPU built in a logic simulator, caches, virtual memory and parallelism, with real labs/projects. Closest match to the scope; public notes, labs and projects every term."
    verified: true
    course:
      latest_term: "Fall 2026"
      latest_url: https://cs61c.org/fa26/
      videos: enrolled-only
      public_videos_term: "Summer 2020 (YouTube playlist); Fall 2020 recordings are linked from the archived course site"
      public_videos_url: https://youtube.com/playlist?list=PLDoI-XvXO0aqgoMQvogzmf7CKiSMSUS3M
      assignments: public
      assignments_url: https://cs61c.org/fa26/labs/
  - id: cs61c-notes
    role: secondary
    kind: website
    title: "CS 61C Course Notes"
    by: "Lisa Yan and CS 61C staff"
    url: https://notes.cs61c.org/
    edition_or_term: "current (CC BY-NC-ND 4.0)"
    access: free
    use: "Read in place of lectures when no recordings are handy: number representation, C, floating point, RISC-V, CPU/datapath, pipelining, caches, VM, parallelism. Includes the RV32I green card."
    why: "A free, well-edited text that mirrors the course order; makes the course self-contained without the paid book if needed."
    verified: true
  - id: eth-ddca
    role: secondary
    kind: course
    title: "ETH Zurich Digital Design and Computer Architecture (Onur Mutlu)"
    by: "ETH Zurich SAFARI group (Onur Mutlu)"
    url: https://safari.ethz.ch/digitaltechnik/spring2026/
    edition_or_term: "Spring 2026 (227-0003-10V)"
    access: free
    use: "Use the public lecture/livestream playlists for deeper treatment of microarchitecture: ISA and assembly, single-cycle and pipelined processors, out-of-order basics, caches, SIMD/GPU. Do the optional HWs; Verilog labs are good if the owner wants to go toward digital-logic."
    why: "Fills the gap of fully public, current-term video lectures (61C's 2026 recordings are enrolled-only) and goes further into microarchitecture; bottom-up from transistors so it overlaps the digital-logic node."
    verified: true
    course:
      latest_term: "Spring 2026"
      latest_url: https://safari.ethz.ch/ddca/spring2026/doku.php?id=start
      videos: public
      assignments: public
      assignments_url: https://safari.ethz.ch/ddca/spring2026/doku.php?id=labs
  - id: drepper-memory
    role: reference
    kind: paper
    title: "What Every Programmer Should Know About Memory"
    by: "Ulrich Drepper"
    url: https://www.akkadia.org/drepper/cpumemory.pdf
    edition_or_term: "2007 (Red Hat), still the best single document on caches, TLBs and DRAM for programmers"
    access: free
    use: "Sections 2-3 (RAM and CPU caches: associativity, write policy, coherence) and 4 (virtual memory/TLB) after the cache chapter of the main text."
    why: "Gives the real-hardware detail (cache associativity, coherence, prefetch, TLB) that textbook caches chapters simplify; hardware details have moved on but the model has not."
    verified: true
  - id: ripes-venus
    role: practice
    kind: tool
    title: "Venus RISC-V simulator (CS 61C)"
    by: "CS 61C staff"
    url: https://venus.cs61c.org/
    edition_or_term: "live"
    access: free
    use: "Write the Lab 3 and 4 RISC-V programs (loops, arrays, recursion, calling convention) and step through them in the web simulator; inspect register/memory state and pipeline behavior."
    why: "Zero-install way to run RISC-V assembly; the same tool the course labs use."
    verified: true
considered:
  - {title: "Harris & Harris, Digital Design and Computer Architecture: RISC-V Edition", url: "https://www.elsevier.com/books/digital-design-and-computer-architecture-risc-v-edition/harris/978-0-12-820064-3", reason: "Strong bottom-up text paired with the ETH course; better fit for the digital-logic node (G11) than for a software-side organization node."}
  - {title: "Nand2Tetris (Part I hardware, Part II software)", url: "https://www.nand2tetris.org/", reason: "Soft background only: builds a toy 16-bit machine from NAND gates; wonderful for intuition but not RISC-V/pipelines/caches, and it belongs with digital-logic."}
  - {title: "Computer Architecture: A Quantitative Approach, 6th ed. (Hennessy & Patterson)", url: "https://shop.elsevier.com/books/computer-architecture/hennessy/978-0-12-811905-1", reason: "Graduate-level reference (OoO, memory hierarchy design, DLP/GPU, warehouse-scale); too heavy for this node, keep for a later advanced-architecture node."}
  - {title: "ETH Computer Architecture (Mutlu) Fall 2026", url: "https://safari.ethz.ch/architecture/fall2026/", reason: "Advanced and memory-centric; public lecture playlists, but it is a graduate-level follow-on rather than the organization node."}
  - {title: "Dive into Systems, architecture chapters", url: "https://diveintosystems.org/", reason: "Already used under computer-systems; its architecture chapters are lighter than 61C."}
notes: "Primary text and course chosen to match (RISC-V, same course Patterson co-created). CS 61C Fall 2026 recordings are published only to bCourses; the Summer 2020 YouTube playlist is the newest public set I could verify and may be partly out of date (earlier editions used different projects). Check whether cs61c.org/sp26 and fa25 are public: they redirected to CalNet login when fetched, so only fa26 pages are verified. ETH DDCA is listed as secondary because its 2026 videos are fully public."
split_proposal: null
prereq_changes: "Consider making digital-logic a soft prerequisite only for the ETH route; the 61C route teaches the needed gates/Logisim internally."
open_questions:
  - "Confirm whether Fall 2020 / Spring 2021 61C lecture videos remain publicly accessible; only the Summer 2020 playlist was confirmed live."
  - "ETH DDCA 2026 labs/HWs are public; whether the lab infrastructure is usable without ETH accounts was not tested."
last_verified: 2026-11-18
