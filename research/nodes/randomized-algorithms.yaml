notes: "Pairing is M&U (book) with Karger's newest recordings, plus Quanrud's free notes/videos/homework as the self-study safety net. Estimated hours assume Chernoff/balls-in-bins/hashing/Markov chains in depth and sketching/streaming at survey depth. The 'sketching and streaming' scope is covered by Quanrud chapters 8-10 and Foundations of Data Science."
