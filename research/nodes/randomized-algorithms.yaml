    use: "Lecture notes on Markov chain mixing, coupling, spectral gap, MCMC and counting (Sinclair's specialty); use for the Markov chains and sampling portion beyond M&U ch. 7 and 11."
    why: "Gap: the best public treatment of rapidly mixing Markov chains (counting, sampling, Glauber dynamics) by the area's authority; lectures are not recorded."
    verified: true
