    kind: course
    title: "Berkeley CS180 Project 4: Neural Radiance Field (plus discussion on cameras/rays and NeRF)"
    by: "Angjoo Kanazawa, Alexei A. Efros (UC Berkeley)"
    url: https://cal-cs180.github.io/fa25
    edition_or_term: "Fall 2025"
