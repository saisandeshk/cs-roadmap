  - id: nerfstudio-gsplat
    role: practice
    kind: tool
    title: "nerfstudio and gsplat (docs and examples)"
    by: "Nerfstudio team (UC Berkeley and contributors)"
    url: https://docs.gsplat.studio/
    edition_or_term: "Current docs; nerfstudio https://docs.nerf.studio/; gsplat repo Apache-2.0"
    access: free
    use: "Capture 50-100 photos of an object, run COLMAP (see multi-view-geometry), train splatfacto (nerfstudio) or the gsplat COLMAP example, compare PSNR/SSIM/LPIPS vs a NeRF baseline, and read the gsplat CUDA rasterizer source after the 3DGS paper."
    why: "Gets a real captured-scene result and exposes the engineering of the rasterizer and densification that the papers describe only briefly."
    verified: true
  - id: hf-3dgs-blog
    role: reference
    kind: article
    title: "Introduction to 3D Gaussian Splatting (Hugging Face blog)"
    by: "Dylan Ebert (Hugging Face)"
    url: https://huggingface.co/blog/gaussian-splatting
    edition_or_term: "Sep 18, 2023"
    access: free
    use: "30-minute conceptual walkthrough (SfM point cloud to Gaussians, training with densification/pruning, rasterization) before reading the paper."
    why: "Quick on-ramp for the 3DGS paper; no math, so not a primary text."
    verified: true
considered:
  - {title: "Stanford CS348N / Wetzstein neural rendering material", url: "https://scenerepresentations.org/courses/", reason: "Not located during this research; MIT 6.8300 and Sitzmann's inverse-graphics course pages (2022/2023 Fall, listed at scenerepresentations.org/courses) are the public equivalents."}
  - {title: "MIT 6.S980 Machine Learning for Inverse Graphics (Sitzmann, Fall 2022/2023)", url: "https://scenerepresentations.org/courses/", reason: "Dedicated course page listed; superseded by 6.8300 which has Spring 2025/2026 recordings."}
  - {title: "KAIST CS479 Spring 2025 / Fall 2023 versions", url: "https://3dml.kaist.ac.kr/", reason: "Same course; use Spring 2026 (latest) and the older ones only as fallback."}
  - {title: "Hugging Face ML for 3D Course (Dylan Ebert)", url: "https://huggingface.co/learn/ml-for-3d-course/unit0/introduction", reason: "Beginner-friendly, generative-demo oriented; table of contents not opened (intro page only). Too light for an advanced node."}
  - {title: "KAIST CS492(C) Diffusion and Flow Models / 3D generation lectures", url: "https://diffusion.kaist.ac.kr/", reason: "Good for 3D generation via diffusion (DreamFusion lineage) but belongs to the diffusion and at-scale nodes."}
  - {title: "UCSD Machine Learning meets Geometry (Hao Su)", url: "https://haosulab.github.io/ml-meets-geometry/WI21/", reason: "Referenced by CMU; 2021 vintage."}
notes: "Primary-text coverage: the Neural Fields STAR (2021) covers only the NeRF-era neural-field half of the scope; 3D Gaussian splatting (surveys 2401.03890, 2403.11134 in nerf-3dgs-papers) and feed-forward reconstruction come from papers and CMU 16-825, with Foundations ch. 45 as the short textbook on-ramp. Default NeRF-from-scratch exercise: KAIST CS479 assignment 2; Berkeley CS180 Project 4 and CMU 16-825 are lighter/alternative options, not all required. Course coverage is split: KAIST (Spring 2026) has the best public lectures and NeRF/3DGS assignments; CMU 16-825 (Fall 2026) has the best reading list and the only public mini-VGGT/LVSM assignment but no confirmed video. Feed-forward reconstruction and generalizable splatting are the fastest-moving parts and are carried by papers. Differentiable rendering is taught inside KAIST/6.8300/CMU; Mitsuba 3 / PyTorch3D / nvdiffrast were not evaluated."
split_proposal: "Consider splitting into 'Neural rendering (NeRF, 3DGS, differentiable rendering)' and '3D deep learning and feed-forward reconstruction / generative 3D (point clouds, meshes, LVSM/VGGT, 3D generation)'. 50 focused hours already strains this single node."
prereq_changes: "Add soft: diffusion-and-flow-matching (for 3D generation, DreamFusion-style score distillation and multi-view diffusion). computer-graphics basics (rasterization, rendering equation) would be a useful soft prerequisite if such a node exists elsewhere."
