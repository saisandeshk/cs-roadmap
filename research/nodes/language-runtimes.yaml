notes: 'Route (about 70 h): CMU 17-770 notes (VM design, object models, JIT tiers) with CS 6120 lessons 11-12 videos; the Bendersky series for a hands-on JIT; extend the clox mark-sweep GC built in the interpreters node (Crafting Interpreters ch. 26) to a copying or generational collector from the Handbook; study the MMTk guide or V8 posts for production examples. Crafting Interpreters ch. 25-26/30 and the Stanford CS 143 GC/JIT lectures were removed here after review R2 because they are already assigned in interpreters and compiler-construction. The hard prerequisites interpreters and computer-systems are right; compiler-construction would help for the JIT half (17-770 assumes compiler knowledge), so consider it a soft prereq. ML compilers are not in scope here. Declined review R2''s claim that CS 6120 lesson 12 has no video: the Fall 2025 page links two lesson-12 videos (''Dynamic Compilers'', ''Tracing via Speculation'').'
split_proposal: null
prereq_changes: 'Add soft: compiler-construction (17-770 explicitly requires prior compiler knowledge for the JIT lectures).'
