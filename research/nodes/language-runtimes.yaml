id: language-runtimes
title: Language Runtimes, GC & JITs
group: G11
paths: [plc]
hard: [interpreters, computer-systems]
soft: []
scope: Garbage collection, virtual machines, JIT compilation, dynamic language implementation.
level: advanced
estimated_hours: 70
resources:
- {id: gc-handbook, role: primary-text, kind: book, title: 'The Garbage Collection Handbook: The Art of Automatic Memory Management, 2nd edition', by: 'Richard Jones, Antony Hosking, Eliot Moss', url: 'https://gchandbook.org/', edition_or_term: 'Second edition (CRC Press, 2023); 21 chapters, contents checked at https://gchandbook.org/contents.html', access: paid, use: 'Ch. 1-4 (introduction, mark-sweep, mark-compact, copying), 5 (reference counting), 6 (comparing collectors), 7 (allocation), 9-11 (generational, other partitioned schemes, run-time interface), and selectively 13-16 (concurrency preliminaries, parallel GC, concurrent GC, concurrent mark-sweep) and 19 (real-time GC); use the pseudo-code to implement a semispace (copying) and a generational collector.', why: 'The definitive reference on GC (algorithms, trade-offs, interfaces to the runtime), updated in 2023 with concurrent, region-based and persistent-memory collectors. Chosen as the primary text because GC is the hardest and most underserved item in the node scope.', verified: true}
- id: cmu-17770
  role: primary-course
  kind: course
  title: CMU 17-770 Virtual Machines and Managed Runtimes
  by: CMU (Ben L. Titzer)
  url: https://www.cs.cmu.edu/~wasm/cs17-770/fall2025/
  edition_or_term: Fall 2025 (Fall 2024 also online; no Fall 2026 page found)
  access: free
  use: 'Public lecture notes: what is a VM, code formats (WebAssembly binary, Java class format), WebAssembly and Java runtime semantics, object models and inline caches, intro to JIT compilers, baseline JITs, optimizing JITs, garbage collection (five lectures), threads; use the syllabus project descriptions (interpreters in Project 1-2, JIT/GC projects) as exercises.'
  why: The best recent course on VMs, JITs and GC together with a runtime-engine project and public lecture notes by the creator of the Wizard engine; no recordings and only the syllabus-level project specs are public.
  verified: true
  course: {latest_term: Fall 2025, latest_url: 'https://www.cs.cmu.edu/~wasm/cs17-770/fall2025/', videos: none, assignments: partial, assignments_url: 'https://www.cs.cmu.edu/~wasm/cs17-770/fall2025/syllabus.html'}
- id: cs6120-runtime
  role: secondary
  kind: course
  title: 'Cornell CS 6120 lessons 11-12: Memory Management and Dynamic Compilers'
  by: Cornell (Adrian Sampson)
  url: https://www.cs.cornell.edu/courses/cs6120/2025fa/lesson/11/
  edition_or_term: Fall 2025 (lesson 12 at https://www.cs.cornell.edu/courses/cs6120/2025fa/lesson/12/)
  access: free
  use: 'Lesson 11 (memory management: video, notes and task) and lesson 12 (videos ''Dynamic Compilers'' and ''Tracing via Speculation'', notes and task). The other CS 6120 lessons are assigned in compiler-optimization.'
  why: 'Public video lectures with notes and papers on GC and JITs: a gentle entry before the Handbook or CMU 17-770.'
  verified: true
  course: {latest_term: Fall 2025, latest_url: 'https://www.cs.cornell.edu/courses/cs6120/2025fa/lesson/', videos: public, assignments: public, assignments_url: 'https://www.cs.cornell.edu/courses/cs6120/2025fa/lesson/'}
- {id: bendersky-jit, role: secondary, kind: article, title: Adventures in JIT compilation (4-part series), by: Eli Bendersky, url: 'https://eli.thegreenplace.net/2017/adventures-in-jit-compilation-part-1-an-interpreter/', edition_or_term: 'Blog series, 2017: part 1 an interpreter, part 2 an x64 JIT, part 3 LLVM, part 4 in Python', access: free, use: 'All four parts in order: optimize a BF interpreter, write an x64 JIT that emits machine code into executable memory, then an LLVM-based JIT and a Python JIT; measure the speedup at each step.', why: 'Structured, hands-on JIT tutorial from interpreter to native code generation, covering the JIT half of the scope that the GC-focused primary text lacks (added after review R2). Parts 1-2 opened; parts 3-4 linked from them.', verified: true}
- {id: mmtk, role: secondary, kind: docs, title: MMTk (Memory Management Toolkit) user guide, by: MMTk project (ANU and collaborators), url: 'https://docs.mmtk.io/', edition_or_term: Rust rewrite; docs live (checked 2026-11-18), access: free, use: 'Read the introduction and porting guide to see how a pluggable GC (NoGC, MarkSweep, Immix, generational plans) binds to OpenJDK, V8, Julia, Ruby, CRuby; optionally run a plan on the dummy VM.', why: 'Industrial-strength, language-independent GC framework by the Handbook''s authors'' community; shows the real runtime-GC interface (roots, object model, write barriers).', verified: true}
- {id: cpython-jit, role: secondary, kind: article, title: 'PEP 744: JIT Compilation (CPython copy-and-patch JIT) and "What is new" for Python 3.13', by: 'Brandt Bucher, Savannah Ostrowski et al.', url: 'https://peps.python.org/pep-0744/', edition_or_term: PEP 744 (checked 2026-11-18), access: free, use: 'Read the PEP for the motivation, tier-2 micro-op optimizer and copy-and-patch design; compare with a method JIT (V8) and tracing JIT (PyPy).', why: 'Unusually clear, current write-up of how a major dynamic-language implementation adds a JIT incrementally.', verified: true}
- {id: v8-blog, role: reference, kind: website, title: V8 blog (JavaScript engine internals), by: V8 team, url: 'https://v8.dev/blog', edition_or_term: Live blog (checked 2026-11-18), access: free, use: 'Pick posts on Ignition/Sparkplug/Maglev/TurboFan tiers, hidden classes and inline caches, and Orinoco GC to see production-grade tiering and GC.', why: Authoritative explanations from the engine's developers on tiered JITs and concurrent GC., verified: true}
- {id: wasm-jvm-spec, role: reference, kind: docs, title: WebAssembly core specification and JVM specification, by: W3C/WebAssembly CG; Oracle, url: 'https://webassembly.github.io/spec/core/', edition_or_term: 'WebAssembly 3.0 draft (2026-11-16); JVM spec SE 25 at https://docs.oracle.com/javase/specs/jvms/se25/html/index.html', access: free, use: 'WebAssembly: structure, validation and execution chapters (the 17-770 reference VM); JVM: the class-file format, instruction set and verification chapters.', why: 'Primary-source definitions of two real VMs, which 17-770 uses as its case studies.', verified: true}
- {id: graal-pypy, role: reference, kind: website, title: GraalVM/Truffle and PyPy documentation, by: Oracle Labs; PyPy team, url: 'https://www.pypy.org/', edition_or_term: 'Live sites (GraalVM: https://www.graalvm.org/)', access: free, use: 'PyPy: the RPython tracing-JIT toolchain description and blog; GraalVM: Truffle language implementation framework and partial evaluation overview.', why: 'Two research-grade approaches to building fast dynamic-language implementations from interpreters, as alternatives to hand-written JITs.', verified: true}
