notes: 'Route (about 70 h): CMU 17-770 notes (VM design, object models, JIT tiers) with CS 6120 lessons 11-12 videos; implement GC from Crafting Interpreters ch. 26 (mark-sweep) and extend to a copying or generational collector from the Handbook; study the MMTk guide or V8 posts for production examples. The hard prerequisites interpreters and computer-systems are right; compiler-construction would help for the JIT half (17-770 assumes compiler knowledge), so consider it a soft prereq. ML compilers are not in scope here.'
split_proposal: null
prereq_changes: 'Add soft: compiler-construction (17-770 explicitly requires prior compiler knowledge for the JIT lectures).'
