id: calculus-single-variable
title: 'Calculus I: Single Variable'
group: G2
paths:
- core
hard: []
soft: []
scope: Limits, derivatives and their applications, integrals and the fundamental theorem, techniques of integration, sequences and series.
level: intro
resources:
- id: openstax-calculus
  role: primary-text
  kind: book
  title: Calculus, Volumes 1-3
  by: OpenStax (Gilbert Strang, Edwin 'Jed' Herman, et al.)
  url: https://openstax.org/details/books/calculus-volume-1
  edition_or_term: 'Volumes 1, 2, 3 (current web editions); Vol 3 page: https://openstax.org/details/books/calculus-volume-3'
  access: free
  use: Volume 1 (limits, derivatives and applications, integration basics) and Volume 2 (integration techniques, sequences and series, parametric/polar). Do the odd-numbered exercises (answers in the back).
  why: The only free text that covers the whole scope (single variable through multiple integrals) at full textbook depth, with graded exercises and answers; pairs with the MIT lectures.
  verified: true
- id: mit-18-01sc
  role: primary-course
  kind: course
  title: MIT 18.01SC Single Variable Calculus
  by: David Jerison (MIT OCW)
  url: https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/
  edition_or_term: Fall 2010 (OCW Scholar)
  access: free
  use: 'All five units: differentiation, applications (approximation, optimization, Newton''s method), definite integral and FTC, techniques of integration, infinite series/Taylor series. Watch lectures, then do the problem-solving videos and problem sets (solutions posted).'
  why: Best-structured free lecture sequence with problem-solving videos, graded problem sets with solutions and four exams with answers; strong on approximation and Taylor series, the parts CS/ML needs most.
  verified: true
  course:
    latest_term: Fall 2010 (18.01SC OCW Scholar); newer MIT 18.01 runs are not public
    latest_url: https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/
    videos: public
    public_videos_term: Lecture clips are Jerison's 18.01 Fall 2006 recordings (OCW clip page cites 'Lecture 1 of 18.01 Fall 2006'; full playlist https://www.youtube.com/playlist?list=PL590CCC2BC5AF3BC1); problem-solving videos are Fall 2010
    public_videos_url: https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/
    assignments: public
    assignments_url: https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/
- id: 3b1b-calculus
  role: secondary
  kind: video-series
  title: Essence of Calculus
  by: Grant Sanderson (3Blue1Brown)
  url: https://www.3blue1brown.com/topics/calculus
  edition_or_term: '2017-18 series (YouTube playlist: https://www.youtube.com/playlist?list=PLZHQObOWTQDMsr9K-rj53DwVRMYO3t5Yr)'
  access: free
  use: Watch Chapters 1-4 (derivative paradox, derivative formulas via geometry, chain/product rule, exponentials) before 18.01 Unit 1, and the integral/Taylor series chapters before Units 3 and 5.
  why: Builds geometric intuition for derivatives, integrals and series; no practice problems, so it supplements rather than replaces the course.
  verified: true
- id: pauls-notes
  role: practice
  kind: website
  title: 'Paul''s Online Math Notes: Calculus I, II, III'
  by: Paul Dawkins (Lamar University)
  url: https://tutorial.math.lamar.edu/
  edition_or_term: Current site
  access: free
  use: 'Practice Problems with full solutions: Calculus I (limits, derivatives, applications, integrals) and Calculus II (integration techniques, series).'
  why: Large bank of worked practice problems with solutions to drill technique after lectures; neither MIT course provides as much routine practice.
  verified: true
- id: mitx-18-01
  role: practice
  kind: practice-site
  title: MITx 18.01.1x / 18.01.2x / 18.01.3x on MIT Open Learning Library
  by: MIT (Jerison, Auroux and team)
  url: https://openlearninglibrary.mit.edu/courses/course-v1:MITx+18.01.1x+2T2019/about
  edition_or_term: Calculus 1A (differentiation), 1B (integration), 1C (coordinate systems and series); self-paced archive runs. The instructor-paced MIT Learn version (https://mitxonline.mit.edu/courses/course-v1:MITxT+18.01.1x/) lists free audit.
  access: account-required
  use: Use the auto-graded problem sets and quizzes of 1A, 1B and 1C as the checked practice track for 18.01SC units.
  why: Auto-graded online problems with instant feedback, the only free source here that checks your answers; OSSU's calculus path uses it.
  verified: true
considered:
- title: Stewart / Thomas' Calculus
  url: https://openstax.org/details/books/calculus-volume-1
  reason: Standard paid textbooks; OpenStax gives equivalent coverage free.
- title: Active Calculus (Matt Boelkins)
  url: https://activecalculus.org/
  reason: Good free inquiry-based single variable text; not full multivariable coverage.
- title: Khan Academy calculus / multivariable calculus
  url: https://www.khanacademy.org/math/multivariable-calculus
  reason: Useful drill platform but could not be opened from this environment (Client Challenge); Paul's Notes and MITx fill the practice role.
- title: MIT 18.02 Fall 2007 (Auroux, full lecture set)
  url: https://ocw.mit.edu/courses/18-02-multivariable-calculus-fall-2007/
  reason: Same lecturer as 18.02SC; kept as the video fallback.
