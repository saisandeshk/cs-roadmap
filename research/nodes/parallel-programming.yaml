id: parallel-programming
title: Parallel Programming
group: G4
paths:
- core
- mlsys
hard:
- computer-systems
soft:
- computer-architecture
- concurrent-programming
scope: Parallel models (SIMD, multicore, GPU intro), work/span, OpenMP, MPI basics, synchronization cost, locality, parallel performance analysis.
level: intermediate
resources:
- id: pacheco-malensek
  role: primary-text
  kind: book
  title: An Introduction to Parallel Programming, 2nd edition
  by: Peter S. Pacheco, Matthew Malensek
  url: https://shop.elsevier.com/books/an-introduction-to-parallel-programming/pacheco/978-0-12-804605-0
  edition_or_term: 2nd edition (Morgan Kaufmann/Elsevier, Nov 2021). Elsevier lists a 3rd edition (Steven A. Wright) with a publication date of Dec 28, 2026, i.e. not yet out as of 2026-11-18
  access: paid
  use: 'Ch. 1-2 (why parallel; hardware/software background, speedup, Amdahl, scalability), 3 (MPI), 4 (Pthreads), 5 (OpenMP), 7 (parallel program development: n-body and tree-search case studies). Ch. 6 (GPU/CUDA) is deferred to the GPU node. Do the programming assignments at chapter ends.'
  why: A single, language-neutral textbook that covers all three mainstream CPU models (MPI, Pthreads, OpenMP) with performance analysis and exercises; closest match to the node scope. No book is perfect here because the strongest teaching is in course notes (below).
  verified: true
- id: cmu-15-418
  role: primary-course
  kind: course
  title: CMU 15-418/15-618 Parallel Computer Architecture and Programming
  by: CMU (Brian Railing, Dimitrios Skarlatos)
  url: https://www.cs.cmu.edu/~418/
  edition_or_term: Fall 2026
  access: mixed
  use: 'Follow the Fall 2026 schedule: slides for every lecture plus the linked YouTube videos (most lectures): why parallelism, ILP, multicore, programming models, GPU/CUDA, parallel programming basics, performance optimization I-II, interconnects, snooping and directory cache coherence, performance analysis/profiling, implementing synchronization, fine-grained/lock-free synchronization, transactional memory, memory consistency. Assignments: A1 Exploring parallel computing (handout PDF public), A2 GPU programming in CUDA (defer to the GPU node), A3 Parallel VLSI wire routing via OpenMP, A4 the same via MPI; A2-A4 handouts are on Autolab, so use CS149''s public assignments and Aalto''s exercises for self-graded practice.'
  why: Newest run with public lecture videos (owner's rule), and its programming assignments cover OpenMP and MPI, which the node scope names and CS149 does not assign. Adds the hardware side (coherence, interconnects, consistency) behind parallel performance.
  verified: true
  course:
    latest_term: Fall 2026
    latest_url: https://www.cs.cmu.edu/~418/schedule.html
    videos: public
    assignments: partial
    assignments_url: https://www.cs.cmu.edu/~418/assignments.html
- id: cs149
  role: secondary
  kind: course
  title: Stanford CS149 Parallel Computing
  by: Kayvon Fatahalian, Kunle Olukotun (Stanford)
  url: https://gfxcourses.stanford.edu/cs149/fall25
  edition_or_term: Fall 2025 (newest run found)
  access: mixed
  use: 'Lectures 1-8 (why parallelism; multicore, SIMD, multithreading; ISPC; parallel programming models; data-parallel thinking; work distribution/scheduling; performance optimization), cache coherence and synchronization, transactional memory. Programming Assignments: A1 (parallel Mandelbrot with threads and ISPC/SIMD on a quad-core CPU), A2 (task-graph scheduling thread pool), A3 (CUDA renderer; GPU depth goes to the GPU node). Written assignments optional.'
  why: The clearest teaching of how hardware parallelism (SIMD, multicore, multithreading) and programming abstractions fit together, with a full public 2023 lecture playlist and public GitHub assignments; secondary because Fall 2025 videos were not published and its assignments do not cover OpenMP/MPI.
  verified: true
  course:
    latest_term: Fall 2025
    latest_url: https://gfxcourses.stanford.edu/cs149/fall25
    videos: none
    public_videos_term: Fall 2023 (Stanford Online YouTube playlist)
    public_videos_url: https://www.youtube.com/playlist?list=PLoROMvodv4rMp7MTFr4hQsDEcX7Bx6Odp
    assignments: public
    assignments_url: https://github.com/stanford-cs149
- id: aalto-ppc
  role: secondary
  kind: website
  title: Programming Parallel Computers (Aalto CS-E4580 lecture notes)
  by: Jukka Suomela et al., Aalto University
  url: https://ppc.cs.aalto.fi/
  edition_or_term: current course notes
  access: free
  use: 'Chapter 1 (role of parallelism) and Chapter 3 (multithreading with OpenMP: parallel for, nowait, schedule, nested, hyper-threading, memory), plus lectures 1-6. Do the self-study exercises at ppc-exercises.cs.aalto.fi. Chapter 2 (the ''shortcut'' optimization case study) is assigned in performance-engineering.'
  why: 'Hidden gem: an unusually practical, free course with an open auto-graded exercise site for self-study; its OpenMP chapter is the most concrete free treatment of the API with measurements.'
  verified: true
- id: llnl-hpc
  role: reference
  kind: website
  title: LLNL HPC Tutorials (OpenMP, MPI, Pthreads)
  by: Lawrence Livermore National Laboratory (Blaise Barney)
  url: https://hpc-tutorials.llnl.gov/
  edition_or_term: current
  access: free
  use: Look up OpenMP directives/clauses, MPI point-to-point and collective calls, and Pthreads API while doing assignments; read 'Introduction to Parallel Computing' for terminology.
  why: Concise, well-organized free references for the exact APIs in the node scope.
  verified: true
- id: the-art-of-hpc
  role: reference
  kind: book
  title: The Art of HPC (Eijkhout et al., TACC textbooks)
  by: Victor Eijkhout
  url: https://theartofhpc.com/
  edition_or_term: current online/PDF volumes
  access: free
  use: 'Volume 2 (Parallel Programming for Science and Engineering): MPI, OpenMP, and hybrid; volume 1 for performance models (roofline, cache) and sparse/dense kernels.'
  why: Free, deep, exercise-bearing alternative to Pacheco for MPI and OpenMP, if the primary book is not wanted.
  verified: true
- id: cs149-asst-practice
  role: practice
  kind: practice-site
  title: Stanford CS149 programming assignments 1-3
  by: Stanford CS149 staff
  url: https://github.com/stanford-cs149/asst1
  edition_or_term: current GitHub repos (asst1, asst2, asst3)
  access: free
  use: 'asst1 (threads and ISPC/SIMD Mandelbrot, prefix-sum/SAXPY analysis), asst2 (task system: spawn threads, thread pool spinning, then sleeping), asst3 (CUDA renderer: skip or defer to the GPU node). Run on any multi-core Linux machine.'
  why: Named, graded-by-speedup exercises that exercise exactly the node's skills.
  verified: true
considered:
- title: Programming Massively Parallel Processors (Hwu, Kirk, El Hajj)
  url: https://www.elsevier.com/books/programming-massively-parallel-processors/hwu/978-0-323-91231-0
  reason: GPU-centric; belongs to G9's GPU node, which the brief says not to research here.
- title: Structured Parallel Programming (McCool, Robison, Reinders)
  url: https://shop.elsevier.com/books/structured-parallel-programming/mccool/978-0-12-415993-8
  reason: Pattern-based approach (map, reduce, scan, pipeline); good but TBB/Cilk-centric and dated.
- title: UIUC ECE 408 Applied Parallel Programming / Stanford CME 213 (MPI, OpenMP, CUDA)
  url: https://www.youtube.com/playlist?list=PLAtMgFDMfGy2mysjPHN_d1cf9sR1muRkq
  reason: CME 213 (2020) has public videos and covers MPI/OpenMP/CUDA; older than CS149 and less hardware insight; kept as MPI-focused alternative. Not opened.
- title: MIT 6.172 (work/span, Cilk)
  url: https://ocw.mit.edu/courses/6-172-performance-engineering-of-software-systems-fall-2018/
  reason: Covers work/span analysis well; assigned to performance-engineering.
- title: Parallel Computing, Georgia Tech CSE 6220 (videos Sp 2025)
  url: https://cse6220.gatech.edu/sp25-oms/
  reason: Algorithmic HPC (MPI collectives, parallel algorithms); more theory than needed here.
notes: 'Primary course switched from CS149 to CMU 15-418 Fall 2026 after review R2 (current public videos; OpenMP and MPI assignments); CS149 remains secondary for its 2023 videos and public assignments. No single text covers this scope as well as the combination of CS149 lectures (best intuition), Pacheco & Malensek (API breadth), and Aalto''s notes (measurement and SIMD). Work/span analysis is sparse in all three: it is taught in MIT 6.172 (performance-engineering); the node scope mentions work/span so watch 6.172 (OCW Fall 2018) L7 ''Races and Parallelism'' and L8 ''Analysis of Multithreaded Algorithms''. GPU programming is out of scope here (G9); CS149 A3 and Aalto ch. 4 are marked as optional.'
split_proposal: null
prereq_changes: null
