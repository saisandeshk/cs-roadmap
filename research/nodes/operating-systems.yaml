id: operating-systems
title: Operating Systems
group: G4
paths: [core]
hard: [computer-systems]
soft: []
scope: "Processes, scheduling, virtual memory, concurrency primitives, file systems, crash consistency (concepts)."

level: intermediate
estimated_hours: 130
resources:
  - id: ostep
    role: primary-text
    kind: book
    title: "Operating Systems: Three Easy Pieces"
    by: "Remzi H. Arpaci-Dusseau, Andrea C. Arpaci-Dusseau"
    url: https://pages.cs.wisc.edu/~remzi/OSTEP/
    edition_or_term: "Version 1.10 (Nov 2023); new security chapters by Peter Reiher"
    access: free
    use: "Virtualization (ch. 4-24: processes, scheduling incl. MLFQ/lottery/multi-CPU, address spaces, segmentation, paging, TLBs, swapping), Concurrency (26-34: threads, locks, condition variables, semaphores, bugs, event-based concurrency), Persistence (36-45: I/O devices, disks/RAID, file system implementation, FFS, crash consistency/journaling, LFS, SSDs, data integrity). Do the homework simulators."
    why: "The clearest conceptual treatment of the topic: short chapters, dialogues, and a homework simulator for nearly every chapter. Free and versioned."
    verified: true
  - id: cs162
    role: primary-course
    kind: course
    title: "UC Berkeley CS 162 Operating Systems and Systems Programming"
    by: "Berkeley EECS (John Kubiatowicz)"
    url: https://cs162.org/
    edition_or_term: "Fall 2026"
    access: mixed
    use: "Lecture slides and discussion worksheets (public); Homeworks 0-3 (intro, linked list, shell, HTTP server) and the Pintos projects: Project 1 User Programs, Project 2 Threads, Project 3 File Systems (see Pintos docs). Readings in Anderson and Dahlin (OSPP) plus OSTEP as secondary."
    why: "Rigorous, systems-programming-heavy OS course with a real kernel (Pintos) project sequence; covers processes, threads, scheduling, synchronization, VM, file systems and transactions. Slides, worksheets, exams and project docs are public every term."
    verified: true
    course:
      latest_term: "Fall 2026"
      latest_url: https://cs162.org/calendar/
      videos: enrolled-only
      public_videos_term: "Spring 2022 (third-party Bilibili mirror per csdiy.wiki) and Fall 2020/Fall 2021 (links on archived course sites); no official public YouTube playlist verified"
      assignments: partial
      assignments_url: https://cs162.org/static/proj/pintos-docs/
  - id: ostep-homework
    role: practice
    kind: practice-site
    title: "OSTEP homework simulators"
    by: "Remzi H. Arpaci-Dusseau, Andrea C. Arpaci-Dusseau"
    url: https://github.com/remzi-arpacidusseau/ostep-homework
    edition_or_term: "current master"
    access: free
    use: "Do these in order with the chapters: cpu-intro (process-run.py), cpu-api (fork.py), cpu-sched, cpu-sched-mlfq, cpu-sched-lottery, vm-mechanism, vm-segmentation, vm-paging, vm-smalltables, vm-beyondphys-policy, threads-intro, threads-locks, threads-api (Helgrind), file-implementation (vsfs.py), file-ffs, file-journaling (fsck.py), file-lfs, file-raid, file-ssd."
    why: "Generates unlimited randomized problems with solutions; the cheapest way to test whether the mechanisms were actually understood."
    verified: true
  - id: ostep-projects
    role: practice
    kind: practice-site
    title: "OSTEP projects (Wisconsin CS 537)"
    by: "Remzi H. Arpaci-Dusseau et al."
    url: https://github.com/remzi-arpacidusseau/ostep-projects
    edition_or_term: "current master"
    access: free
    use: "C/Linux track: initial-utilities (wcat, wgrep, wzip/wunzip), initial-reverse, processes-shell (wish), concurrency-webserver, concurrency-pzip. Tests are provided as test-*.sh scripts."
    why: "Self-contained programming projects with local test scripts; complements CS 162's Pintos projects (which are hard to self-grade). Kernel-hacking xv6 projects are covered by os-kernel-implementation."
    verified: true
  - id: ece344
    role: secondary
    kind: course
    title: "University of Toronto ECE344 Operating Systems (Jon Eyolfson)"
    by: "Jon Eyolfson, University of Toronto"
    url: https://eyolfson.com/courses/archive/utoronto/ece344/2024-fall/
    edition_or_term: "Fall 2024"
    access: free
    use: "Use as the video track for the same OSTEP-style content: all 35 lectures have public slides and YouTube recordings (kernels, process creation, scheduling, virtual memory, page replacement, locks, semaphores, disks/filesystems/inodes, memory allocators, virtual machines). Lab docs are linked from the page."
    why: "Fills the video gap of CS 162 (enrolled-only): a complete, recent, public lecture set aligned to OSTEP plus public slides, midterm and final."
    verified: true
    course:
      latest_term: "Fall 2024"
      latest_url: https://eyolfson.com/courses/archive/utoronto/ece344/2024-fall/
      videos: public
      assignments: public
      assignments_url: https://compeng-gg.github.io/2024-fall-ece344-docs/
  - id: tlpi
    role: reference
    kind: book
    title: "The Linux Programming Interface"
    by: "Michael Kerrisk"
    url: https://man7.org/tlpi/
    edition_or_term: "2010 (No Starch Press)"
    access: paid
    use: "Reference for the system-call API when doing the projects: ch. 24-28 (process creation/exec), 44 (pipes), 49 (mmap), 29-33 (threads), 13-15 (file I/O and file systems)."
    why: "The definitive reference for the Linux/POSIX API that the OS concepts are exercised through; far more precise than the course texts on syscall semantics."
    verified: true
considered:
  - {title: "Operating Systems: Principles and Practice, 2nd ed. (Anderson & Dahlin)", url: "https://ospp.cs.washington.edu/", reason: "CS 162's primary text; strong on synchronization and concurrency design but overlaps OSTEP and is paid; use as a second opinion on synchronization."}
  - {title: "Wisconsin CS 537 Introduction to Operating Systems", url: "https://pages.cs.wisc.edu/~remzi/Classes/537/", reason: "The OSTEP course itself, but its page is just an index of old terms (newest Fall 2022) and I found no public lecture recordings; the projects repo is used instead."}
  - {title: "MIT 6.1810 Operating System Engineering", url: "https://pdos.csail.mit.edu/6.1810/", reason: "Best hands-on kernel course; kept as the primary of the os-kernel-implementation node so this node stays conceptual."}
  - {title: "NJU Operating System Design and Implementation (Yanyan Jiang)", url: "https://github.com/pkuflyingpig/cs-self-learning/blob/master/docs/%E6%93%8D%E4%BD%9C%E7%B3%BB%E7%BB%9F/NJUOS.en.md", reason: "Highly regarded 'programs as state machines' approach, but lectures are in Chinese (Bilibili); link is the csdiy.wiki summary, not verified live."}
  - {title: "Operating System Concepts (Silberschatz, Galvin, Gagne)", url: "https://www.os-book.com/", reason: "Encyclopedic; kept out because OSTEP covers the same ground more clearly."}
notes: "OSTEP is the primary text; Berkeley CS 162 is the primary course because it keeps pace with the book's content, is current (Fall 2026), has public slides and project docs, and pairs with a real kernel project (Pintos). Its biggest weakness is video: the Fall 2026 lectures are on bCourses only, and I could not find an official public playlist (only third-party mirrors of Fall 2020 to Spring 2022 per csdiy.wiki), so ECE344 Fall 2024 is added as the public-video option. Pintos projects need the course autograder to grade; local tests exist but are thinner than xv6 'make grade'. Strictly, MIT 6.1810 could be the course here too; it is assigned to os-kernel-implementation."
split_proposal: null
prereq_changes: "Consider adding concurrent-programming (soft) as a prerequisite of operating-systems or moving OSTEP's concurrency part to concurrent-programming; today OS lists no soft prereq."
open_questions:
  - "No official public CS 162 video playlist verified; the Spring 2022 mirror is third-party (Bilibili) and was not opened."
  - "cs162.org archive page (inst.eecs.berkeley.edu/~cs162/archives.html) requires CalNet login."
  - "ECE344 lab docs link (compeng-gg.github.io) not opened; assignments marked public from the page link only."
last_verified: 2026-11-18
