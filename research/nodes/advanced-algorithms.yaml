notes: "No single book covers the scope, so the primary-text is Gupta's graduate notes (free), with Karger's lecture notes and videos as the course, Roughgarden's CS261 as the clearest on-ramp for flows/LP, and Demaine's 6.851 for advanced data structures. Karger's newest recordings (Fall 2022/2024) were not found; the Fall 2021 recordings are public on YouTube via the materials page. 170 hours assumes selecting about two thirds of the material. Review R1 asked whether Cornell CS 5820/6820 Fall 2025 (newer, per-lecture recordings) should replace Karger: its Zoom recording links returned a Zoom error page when opened without a Cornell login (tested 2026-11-19), so Karger stays primary. A second streaming treatment (Foundations of Data Science, Blum-Hopcroft-Kannan) is listed in randomized-algorithms and not repeated here."
split_proposal: "Consider splitting out 'Data Structures (Advanced)' (persistence, integer structures, hashing, cache-oblivious; Demaine 6.851) and 'Streaming and Sketching' from this node; the scope as written covers four distinct areas."
prereq_changes: "Add soft: [probability] and soft: [linear-algebra] (LP duality, JL, SVD, concentration)."
