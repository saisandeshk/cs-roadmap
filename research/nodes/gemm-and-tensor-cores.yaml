id: gemm-and-tensor-cores
title: "Matmul, Tensor Cores & Low Precision"
group: G9
paths: [mlsys]
hard: [gpu-performance-optimization]
soft: []
scope: "GEMM optimization, tensor cores, CUTLASS/CuTe, FP8/FP4, FlashAttention as a fusion case study."

level: advanced
estimated_hours: 70
resources:
  - id: gordic-matmul
    role: primary-text
    kind: article
    title: "Inside NVIDIA GPUs: Anatomy of high performance matmul kernels"
    by: "Aleksa Gordic"
    url: https://www.aleksagordic.com/blog/matmul
    edition_or_term: "2025"
    access: free
    use: "Whole post: GPU architecture and memory/compute model, PTX/SASS, near-SOTA synchronous kernel (warp-tiling), then asynchronous Hopper kernels: TMA loads into SMEM, swizzling and the XOR mask, tensor cores (wgmma), epilogue."
    why: "A single coherent path from Ampere-style tiled GEMM to Hopper asynchronous pipelines with code; fills the gap between the Boehm worklog (CUDA-core only) and vendor docs."
    verified: true
  - id: mit-6s894-gemm
    role: primary-course
    kind: course
    title: "MIT 6.S894 Accelerated Computing (matmul and tensor core labs)"
    by: "Jonathan Ragan-Kelley and staff (MIT EECS)"
    url: https://accelerated-computing.academy/fall25/
    edition_or_term: "Fall 2025"
    access: free
    use: "Lecture 8 (Evolving Ampere to Hopper); Lab 6 (Matrix Multiply with Tensor Cores) and Lab 10 (H100 Matrix Multiplication). Lectures 3-6 and Labs 4-5 are in gpu-performance-optimization."
    why: "Only public course whose labs take a student from tiled matmul to tensor-core and H100 (TMA/wgmma) matmul with a written analysis; lectures are filmed."
    verified: true
    course:
      latest_term: "Fall 2025"
      latest_url: https://accelerated-computing.academy/fall25/
      videos: public
      assignments: partial
      assignments_url: https://accelerated-computing.academy/fall25/labs
  - id: boehm-matmul-gemm
    role: secondary
    kind: article
    title: "How to Optimize a CUDA Matmul Kernel (Boehm worklog), kernels 7-10"
    by: "Simon Boehm"
    url: https://siboehm.com/articles/22/CUDA-MMM
    edition_or_term: "2022"
    access: free
    use: "Kernels 7-10 (bank-conflict fixes, autotuning, warptiling); kernels 1-6 are done in gpu-performance-optimization."
    why: "Foundation for everything tensor-core based; prerequisite practice."
    verified: true
  - id: pranjal-h100
    role: secondary
    kind: article
    title: "Outperforming cuBLAS on H100: a Worklog"
    by: "Pranjal Shankhdhar"
    url: https://cudaforfun.substack.com/p/outperforming-cublas-on-h100-a-worklog
    edition_or_term: "2024"
    access: free
    use: "Read after Gordic's post: TMA, wgmma, warp specialization, persistent kernels, cluster multicast, Hilbert-curve scheduling step by step."
    why: "Hidden gem: the Hopper counterpart of the Boehm worklog, ending at cuBLAS-beating performance."
    verified: true
  - id: colfax-wgmma
    role: secondary
    kind: article
    title: "CUTLASS Tutorial: Fast Matrix-Multiplication with WGMMA on NVIDIA Hopper GPUs"
    by: "Colfax Research"
    url: https://research.colfax-intl.com/cutlass-tutorial-wgmma-hopper/
    edition_or_term: "2024 (part of a CUTLASS tutorial series)"
    access: free
    use: "TiledMMA for WGMMA, SMEM layout constraints, fragments and descriptors, synchronization; then the series' GEMM pipelining and persistent kernel posts."
    why: "Best explanation of how CuTe/CUTLASS 3 expresses Hopper kernels; bridges hand-written PTX and library code."
    verified: true
  - id: cute-docs
    role: reference
    kind: docs
    title: "CUTLASS / CuTe documentation (Getting Started with CuTe, Layout Algebra, GEMM tutorial, CUTLASS 3.x design)"
    by: "NVIDIA"
    url: https://docs.nvidia.com/cutlass/latest/media/docs/cpp/cute/00_quickstart.html
    edition_or_term: "latest docs"
    access: free
    use: "00 Quickstart, 01 Layout, 02 Layout Algebra, 0x GEMM tutorial (https://docs.nvidia.com/cutlass/latest/media/docs/cpp/cute/0x_gemm_tutorial.html), and the CUTLASS 3.x design page (https://docs.nvidia.com/cutlass/latest/media/docs/cpp/cutlass_3x_design.html)."
    why: "Primary source for layouts and the tiled-MMA abstraction used by FlashAttention-3 and most production kernels; layout algebra is the hard prerequisite for reading modern kernels."
    verified: true
  - id: modern-gpu-mlsys
    role: secondary
    kind: book
    title: "Modern GPU Programming for MLSys"
    by: "MLC AI / contributors (Tianqi Chen's group)"
    url: https://mlc.ai/modern-gpu-programming-for-mlsys/
    edition_or_term: "online book, 2026, Blackwell-focused"
    access: free
    use: "Part I (GPU execution model, data layout, TMA, tcgen05.mma, TMEM, mbarrier, CLC), Part III (tiled GEMM to pipelined and warp-specialized GEMM) and Part IV (FlashAttention 4)."
    why: "Newest free treatment of Blackwell GEMM and FA4; shows where the hardware is going. Uses the TIRx DSL for code, so read for concepts."
    verified: true
  - id: flashattention-papers
    role: secondary
    kind: paper
    title: "FlashAttention (1, 2, 3)"
    by: "Tri Dao et al."
    url: https://arxiv.org/abs/2205.14135
    edition_or_term: "FA1 NeurIPS 2022; FA2 arXiv 2307.08691; FA3 arXiv 2407.08608"
    access: free
    use: "FA1 (IO-aware tiling, online softmax recomputation), FA2 (work partitioning), FA3 (Hopper asynchrony, warp specialization, FP8). Also read the online-softmax paper arXiv 1805.02867."
    why: "The canonical kernel-fusion case study named in the scope; FA3 is also the best example of a Hopper-optimized kernel."
    verified: true
  - id: low-precision-formats
    role: reference
    kind: paper
    title: "FP8 Formats for Deep Learning; Microscaling Data Formats (MX); Pretraining LLMs with NVFP4"
    by: "Micikevicius et al. (NVIDIA/Arm/Intel); Rouhani et al. (OCP); NVIDIA"
    url: https://arxiv.org/abs/2209.05433
    edition_or_term: "arXiv 2209.05433 (FP8), 2310.10537 (MX), 2509.25149 (NVFP4)"
    access: free
    use: "FP8 E4M3/E5M2 definitions and recipes; MX block-scaled formats (MXFP8/6/4); NVFP4 training recipe (scaling, rounding, Hadamard)."
    why: "Primary sources for the FP8/FP4 part of the scope; short, and the block-scaling idea is what modern tensor cores implement in hardware."
    verified: true
  - id: thunderkittens-gemm
    role: practice
    kind: tool
    title: "ThunderKittens educational H100 GEMM series"
    by: "HazyResearch (Stanford)"
    url: https://github.com/HazyResearch/ThunderKittens
    edition_or_term: "ThunderKittens 2.0 (Jan 2026, Blackwell support with MXFP8/NVFP4)"
    access: free
    use: "Work through kernels/gemm/educational_h100 (successively faster H100 GEMMs) and compare with your own wgmma kernel; paper arXiv 2410.20399."
    why: "Tile-based abstraction makes tensor-core kernels short enough to read in one sitting; good contrast to CuTe."
    verified: true
  - id: leetgpu-gemm
    role: practice
    kind: practice-site
    title: "LeetGPU GEMM and quantized matmul challenges"
    by: "LeetGPU"
    url: https://leetgpu.com/challenges
    edition_or_term: "hosted"
    access: account-required
    use: "Matrix Multiplication and Quantized GEMM problems (Attention is in kernel-dsls): implement with shared-memory tiling then tensor-core (WMMA/MMA) variants."
    why: "Hosted GPU to test; useful when no Hopper/Blackwell hardware is at hand."
    verified: true
  - id: cmu-15442-tirx
    role: practice
    kind: practice-site
    title: "CMU 15-442 Assignment: FP16 GEMM on Blackwell with TIRx"
    by: "Tianqi Chen, Zhihao Jia (CMU)"
    url: https://mlsyscourse.org/schedule
    edition_or_term: "Spring 2026, Lab 3 (schedule page opened; lab repo not opened)"
    access: free
    use: "Lectures on ML compiler GEMM on modern GPUs (Feb 25) and Blackwell GPU and TIRx (Mar 11), then Lab 3: write and tune an FP16 GEMM kernel with TIRx."
    why: "Most current structured GEMM assignment (Blackwell B200); needs Blackwell hardware or the course's Modal credits."
    verified: true
considered:
  - {title: "Programming Massively Parallel Processors 5e, Ch. 23 Advanced Optimizations for Matrix Multiplication", url: "https://shop.elsevier.com/books/programming-massively-parallel-processors/hwu/978-0-443-43900-1", reason: "Adds textbook coverage of advanced matmul; chapter-level only, I could not read it. Good optional companion."}
  - {title: "Colfax GEMM series other posts (GEMM pipelining, CUTLASS tutorial on TMA)", url: "https://research.colfax-intl.com/", reason: "Linked via the WGMMA tutorial; kept as optional continuation."}
  - {title: "AI Systems Performance Engineering (Fregly)", url: "https://www.oreilly.com/library/view/ai-systems-performance/9798341627772/", reason: "Covers tensor cores/CUTLASS briefly; not verified, broader than needed."}
  - {title: "GPU MODE lectures 15, 23, 36, 57, 86, 103 (CUTLASS, tensor cores, CuTe, CuTeDSL)", url: "https://github.com/gpu-mode/lectures", reason: "Good video complements to the CuTe docs; speaker-dependent quality, so kept as optional."}
  - {title: "DeepGEMM (DeepSeek) / CUTLASS examples source", url: "https://github.com/deepseek-ai/DeepGEMM", reason: "Excellent compact FP8 GEMM source to read, but not opened by me."}
notes: "Requires access to Ampere/Hopper/Blackwell hardware for the second half (rent cloud GPUs). The cmu-15442-tirx entry points at the opened course schedule page (lists the Blackwell/TIRx lecture and Lab 3); the lab repo was not opened and is not named here. Hours: ~25 h reading, ~45 h labs/kernels. No-GPU path (readable only): Gordic post, Colfax WGMMA tutorial, CuTe docs, Pranjal worklog, Modern GPU Programming book, the FlashAttention and low-precision papers; hardware needed for MIT Lab 6/10, ThunderKittens, the 15-442 TIRx lab and LeetGPU-style kernel tuning on Hopper/Blackwell."
split_proposal: "Consider splitting low-precision numerics (FP8/MX/NVFP4, quantized GEMM) into its own short node shared with model-compression, since it stands apart from kernel engineering."
prereq_changes: null
open_questions:
  - "The schedule page (opened) lists the Blackwell/TIRx lecture and Lab 3, but the lab repo itself was not opened (github 403 to curl). Also whether it is runnable without Blackwell GPU or Modal credits."
  - "No verification of PMPP 5e Ch. 23 content beyond the publisher table of contents."
last_verified: 2026-11-18
