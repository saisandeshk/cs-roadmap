id: alignment-and-oversight
title: Alignment Methods & Oversight
group: G8
paths:
- safety
hard:
- post-training
soft:
- rl-for-llms
- ai-safety-foundations
scope: RLHF failure modes, reward hacking, scalable oversight, debate, weak-to-strong generalization, AI control.
level: advanced
resources:
- id: core-reading-spine
  role: primary-text
  kind: paper
  title: 'Core reading spine: Casper et al. (RLHF limits), Gao et al. (over-optimization), Burns et al. (weak-to-strong), Greenblatt et al. (AI control)'
  by: Casper et al.; Gao, Schulman, Hilton; Burns et al.; Greenblatt et al.
  url: https://arxiv.org/abs/2307.15217
  edition_or_term: TMLR 2023; ICML 2023; ICML 2024; arXiv 2023
  access: free
  use: 'Read in order: Open Problems and Fundamental Limitations of RLHF (2307.15217; full survey: problems with feedback, reward model, policy; tractable vs fundamental limitations), Scaling Laws for Reward Model Overoptimization (https://arxiv.org/abs/2210.10760; gold vs proxy reward and KL), Weak-to-Strong Generalization (https://arxiv.org/abs/2312.09390), AI Control: Improving Safety Despite Intentional Subversion (https://arxiv.org/abs/2312.06942). Then branch into the secondary paper bundles and use the BlueDot list as a map.'
  why: A stable, fixed set of four papers covering the scope (RLHF failure modes, reward hacking, weak-to-strong, AI control) in place of a cohort reading list whose contents change; the four titles were confirmed on arXiv.
  verified: true
- id: bluedot-technical-ai-safety
  role: reference
  kind: website
  title: BlueDot Technical AI Safety curriculum (readings map)
  by: BlueDot Impact
  url: https://bluedot.org/courses/technical-ai-safety/1/1
  edition_or_term: Current (cohorts 30 Nov 2026 onward)
  access: free
  use: 'Browse the six units: (1) the technical challenge with AI, (2) safety training techniques (feeding AI good data, teaching AI right from wrong, more safety techniques), (3) detecting danger (evaluations and lab safety testing), (4) understanding AI (interpretability), (5) minimising harm (assuming harm, building defences, breaking the kill chain), (6) start contributing; read the core readings per unit.'
  why: 'Most up-to-date curated reading path (cohorts run through early 2027) spanning safety training, evaluations, interpretability and defences in one place; free to read. Note: it is a curated reading list, not a self-contained textbook, so it is the map rather than the primary text (the core reading spine above is the fixed set).'
  verified: true
- id: arena-ch4
  role: primary-course
  kind: course
  title: 'ARENA Chapter 4: Alignment Science'
  by: ARENA (Callum McDougall and contributors)
  url: https://learn.arena.education/chapter4_alignment_science/
  edition_or_term: Continuously updated (site build 2026-11-18)
  access: free
  use: 4.1 Emergent Misalignment, 4.2 Science of Misalignment, 4.3 Interpreting Reasoning Models, 4.4 LLM Psychology and Persona Vectors, 4.5 Investigator Agents; plus 3.5 AI Control and 2.4.3 RLAIF (Goodhart) from the evals/RL chapters.
  why: Hands-on case studies (white-box and black-box) of misalignment, with provided notebooks; fills the empirical-practice gap left by reading lists.
  verified: true
  course:
    latest_term: Continuously updated (2026-11-18 build)
    latest_url: https://learn.arena.education/chapter4_alignment_science/
    videos: none
    assignments: public
    assignments_url: https://learn.arena.education/chapter4_alignment_science/
- id: harvard-alignment-lectures
  role: secondary
  kind: course
  title: Harvard CS 2881R AI Safety (alignment-relevant lectures)
  by: Boaz Barak (Harvard)
  url: https://boazbk.github.io/mltheoryseminar/
  edition_or_term: Fall 2026 (current); Fall 2025 archive
  access: free
  use: 'Alignment-method lectures only (intro/risk-landscape lectures are in ai-safety-foundations). Fall 2025: Model Specifications, Capabilities vs Safety, Scheming and Deception, Recursive Self-Improvement, Interpretability; Fall 2026 schedule: Grading and Reward Hacking, Model Policies, Alignment and Recursive Self-Improvement (videos posted as the term proceeds).'
  why: University-style lectures with experiments on specs, reward hacking and scheming; complements the reading/hands-on items.
  verified: true
  course:
    latest_term: Fall 2026 (running)
    latest_url: https://boazbk.github.io/mltheoryseminar/
    videos: public
    public_videos_term: Fall 2025 (full playlist) and Fall 2026 lectures posted so far
    public_videos_url: https://youtube.com/playlist?list=PL_b4B2IWlal3j01Rbj5ebT663E7x4bl_W
    assignments: partial
    assignments_url: https://boazbk.github.io/mltheoryseminar/fall2025/
- id: overopt-and-cai
  role: secondary
  kind: paper
  title: 'AI feedback and harmlessness training: Constitutional AI, HH-RLHF'
  by: Bai et al.
  url: https://arxiv.org/abs/2212.08073
  access: free
  use: Constitutional AI (2212.08073); Training a Helpful and Harmless Assistant (https://arxiv.org/abs/2204.05862). (Gao et al. over-optimization is in the core reading spine.)
  why: The first scalable AI-feedback methods and the HH-RLHF baseline the spine papers critique.
  verified: true
- id: scalable-oversight
  role: secondary
  kind: paper
  title: 'Scalable oversight: debate, reward modeling agenda, measuring progress'
  by: Irving et al.; Leike et al.; Bowman et al.
  url: https://arxiv.org/abs/1805.00899
  access: free
  use: AI safety via debate (1805.00899), Scalable agent alignment via reward modeling (https://arxiv.org/abs/1811.07871), Measuring Progress on Scalable Oversight (https://arxiv.org/abs/2211.03540). (Weak-to-Strong Generalization is in the core reading spine.)
  why: Primary papers for debate and the reward-modeling agenda named in the scope.
  verified: true
- id: ai-control
  role: secondary
  kind: paper
  title: 'AI control follow-ups: Ctrl-Z and safety cases'
  by: Redwood Research and collaborators
  url: https://arxiv.org/abs/2504.10374
  access: free
  use: 'Ctrl-Z: Controlling AI Agents via Resampling (2504.10374), A sketch of an AI control safety case (https://arxiv.org/abs/2501.17315); browse the Alignment Forum AI Control sequence (https://www.alignmentforum.org/s/PC3yJgdKvk8kzqZyA). The original AI Control paper (2312.06942) is in the core reading spine.'
  why: Follow-up reading for "AI control", a distinct approach from alignment; includes safety-case framing.
  verified: true
- id: misalignment-evidence
  role: secondary
  kind: paper
  title: 'Empirical misalignment: Sleeper Agents, Alignment faking, Emergent misalignment, CoT monitoring'
  by: Hubinger et al.; Greenblatt et al.; Betley et al.; Baker et al.; Korbak et al.
  url: https://arxiv.org/abs/2401.05566
  access: free
  use: Home node for these papers across the safety nodes (evals-and-red-teaming and adversarial-robustness cross-reference them). Sleeper Agents (2401.05566), Alignment faking (https://arxiv.org/abs/2412.14093), Emergent Misalignment (https://arxiv.org/abs/2502.17424), Monitoring Reasoning Models for Misbehavior (https://arxiv.org/abs/2503.11926), Chain of Thought Monitorability (https://arxiv.org/abs/2507.11473).
  why: Demonstrations that safety training can fail and how monitoring might help.
  verified: true
