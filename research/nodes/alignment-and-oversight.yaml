notes: No textbook covers scalable oversight, debate, weak-to-strong and control; a fixed four-paper reading spine (Casper, Gao, Burns, Greenblatt), the BlueDot list as a map, plus hands-on ARENA content is the best available. This node overlaps rl-for-llms (RLHF failure modes) and evals (model organisms); each paper is assigned to one G8 node (Sleeper Agents, alignment faking and emergent misalignment live here; Gao over-optimization is here, not in rl-for-llms). BlueDot unit contents were verified from the course page listing (six units); the readings inside each unit were not individually opened.
