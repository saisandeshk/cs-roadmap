notes: No textbook covers scalable oversight, debate, weak-to-strong and control; a curated reading list (BlueDot) plus hands-on ARENA content is the best available. This node overlaps rl-for-llms (RLHF failure modes) and evals (model organisms); the paper bundles are intentionally cross-listed. BlueDot unit contents were verified from the course page listing (six units); the readings inside each unit were not individually opened.
