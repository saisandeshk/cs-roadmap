- title: tinygrad / micrograd source
  url: https://github.com/tinygrad/tinygrad
  reason: Included via docs and notes; GitHub repo pages not directly opened.
- title: Dive into Deep Learning
  url: https://d2l.ai/
  reason: Framework usage, not internals; belongs to deep-learning-fundamentals.
notes: Primary-text is deliberately a pair of blog posts by a core maintainer (2019 and 2020) because no book covers PyTorch's real architecture; the posts cover eager mode, autograd and the dispatcher only and predate PyTorch 2 (Dynamo/Inductor, DTensor), which are in ml-compilers and model-parallelism; mlsysbook Ch. 7 supplies the textbook framing. The Fall 2026 CMU term is running now (lectures through Dec 2026); the new-term lectures are recorded for enrolled students and the lectures page says public-course videos will be posted when available (none seen yet), while the 2022 public recordings and the assignment repos stay open. The homework autograder (mugrade) is stated for enrolled students; I treated assignments as public because notebooks/repos with tests are public.
split_proposal: null
prereq_changes: null
