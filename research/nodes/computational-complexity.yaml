notes: "Arora-Barak plus O'Donnell's Fall 2017 videos is the canonical self-study route. Freshest public material is Cornell CS 6810 (Spring 2026, notes only). Derandomization/hardness vs randomness and circuit lower bounds are the deepest parts; 170 hours assumes full coverage of those two units. Estimates exclude quantum complexity, which lives in quantum-computing."
split_proposal: "Consider splitting into 'Complexity I' (hierarchies, space, PH, randomized classes, circuits) and 'Complexity II / Proofs and Pseudorandomness' (IP, PCP, derandomization, hardness amplification) because the scope is two courses' worth."
prereq_changes: "Add soft: [probability] (randomized classes, error reduction, Chernoff) and soft: [linear-algebra] (algebraic arguments in IP/PCP, Razborov-Smolensky)."
open_questions:
