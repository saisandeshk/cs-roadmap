  - "fast.ai notebooks repo (github.com/fastai/numerical-linear-algebra) returns HTTP 403 to automated clients; not opened. The fast.ai landing page and the YouTube playlist were opened."
  - "Numerical Recipes, Heath and Demmel were considered but not given URLs (not opened)."
