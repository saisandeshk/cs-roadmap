id: advanced-database-systems
title: Advanced Database Systems
group: G10
paths:
- databases
hard:
- query-processing
- transactions-and-recovery
soft: []
scope: In-memory and columnar storage, vectorized/compiled execution, modern OLAP, cloud-native databases.
level: advanced
resources:
- id: redbook
  role: primary-text
  kind: book
  title: Readings in Database Systems, 5th edition (the Red Book)
  by: Peter Bailis, Joseph M. Hellerstein, Michael Stonebraker (eds.)
  url: https://www.redbook.io/
  edition_or_term: 5th edition (2015); free HTML and PDF, CC BY-NC-SA 4.0
  access: free
  use: Preface; Ch. 4 New DBMS Architectures (introduction plus C-Store column store, Hekaton memory-optimized OLTP, OLTP Through the Looking Glass), Ch. 5 Large-Scale Dataflow Engines, Ch. 8 Interactive Analytics; Ch. 2 (Traditional RDBMS Systems, includes the Architecture of a Database System paper) as background. Read the editors' chapter introductions in full and the listed papers selectively.
  why: 'A free, opinionated, expert-curated map of the field: each chapter introduction explains why the architectures changed (the death of one-size-fits-all) and points to the primary papers. It is from 2015, so vectorized/compiled execution, lakehouses and cloud-native engines come from the 15-721 papers below. No single modern textbook covers this node, hence the papers-plus-course route.'
  verified: false
- id: cmu-15721
  role: primary-course
  kind: course
  title: CMU 15-721 Advanced Database Systems
  by: Andy Pavlo (Spring 2024); Jignesh Patel (Fall 2025)
  url: https://15721.courses.cs.cmu.edu/spring2024/schedule.html
  edition_or_term: Fall 2025 is the latest term; Spring 2024 has public videos
  access: free
  use: 'Spring 2024 lectures with the assigned papers: #1 Modern Analytical Database Systems, #2-3 Data Formats and Encoding, #4-5 Query Execution and Processing, #6 Vectorized Query Execution, #7 Code Generation and Compilation, #8 Scheduling and Coordination, #9-10 Hash and Multi-Way Joins, #13-16 Optimizer Implementation and Cost Models, #17-23 System Analysis (Dremel/BigQuery, Databricks/Spark, Snowflake, DuckDB, Yellowbrick, Redshift, Synapse). Skip the networking and UDF lectures on a first pass.'
  why: The only public graduate course focused on exactly this scope (columnar formats, vectorization vs compilation, OLAP and cloud-native systems), with slides, notes, papers and a public YouTube playlist. The Fall 2025 page (Jignesh Patel) lists the same paper-reading format but no public recordings; the paper directory is public. It has a research project but no public autograded assignments.
  verified: true
  course:
    latest_term: Fall 2025
    latest_url: https://15721.courses.cs.cmu.edu/
    videos: none
    public_videos_term: Spring 2024 (Pavlo; CMU Database Group YouTube)
    public_videos_url: https://www.youtube.com/playlist?list=PLSE8ODhjZXjYa_zX-KeMJui7pcN1rIaIJ
    assignments: none
    assignments_url: https://15721.courses.cs.cmu.edu/spring2024/schedule.html
- id: kersten
  role: secondary
  kind: paper
  title: Everything You Always Wanted to Know About Compiled and Vectorized Queries But Were Afraid to Ask
  by: Timo Kersten, Viktor Leis, Alfons Kemper, Thomas Neumann, Andrew Pavlo, Peter Boncz (VLDB 2018)
  url: https://www.vldb.org/pvldb/vol11/p2209-kersten.pdf
  edition_or_term: VLDB 2018
  access: free
  use: Read in full after lectures 4-7; then MonetDB/X100 (https://www.cidrdb.org/cidr2005/papers/P19.pdf) for the original vectorized engine.
  why: 'Gap: the definitive head-to-head comparison of the two execution models in the node scope.'
  verified: true
- id: lakehouse
  role: secondary
  kind: paper
  title: 'Lakehouse: A New Generation of Open Platforms that Unify Data Warehousing and Advanced Analytics'
  by: Michael Armbrust, Ali Ghodsi, Reynold Xin, Matei Zaharia (CIDR 2021)
  url: https://www.cidrdb.org/cidr2021/papers/cidr2021_paper17.pdf
  edition_or_term: CIDR 2021
  access: free
  use: Read in full; then the Iceberg table spec (https://iceberg.apache.org/spec/) for a concrete open table format.
  why: 'Gap: the architecture of modern OLAP over object storage; the first paper in CMU''s syllabus.'
  verified: true
- id: snowflake
  role: secondary
  kind: paper
  title: The Snowflake Elastic Data Warehouse
  by: Benoit Dageville et al. (SIGMOD 2016)
  url: https://info.snowflake.com/rs/252-RFO-227/images/Snowflake_SIGMOD.pdf
  edition_or_term: SIGMOD 2016 (vendor-hosted PDF)
  access: free
  use: Read for the separation of storage and compute, micro-partitions and multi-cluster shared data architecture.
  why: 'Gap: the canonical cloud-native warehouse design, central to the ''cloud-native databases'' item in scope.'
  verified: true
- id: dremel
  role: secondary
  kind: paper
  title: 'Dremel: A Decade of Interactive SQL Analysis at Web Scale'
  by: Sergey Melnik et al. (VLDB 2020)
  url: https://www.vldb.org/pvldb/vol13/p3461-melnik.pdf
  edition_or_term: VLDB 2020
  access: free
  use: Read for in-situ analysis, disaggregated storage, shuffle service and columnar nested data; the original Dremel paper is at https://research.google/pubs/dremel-interactive-analysis-of-web-scale-datasets-2/.
  why: 'Gap: how a cloud OLAP engine evolved over ten years; the BigQuery lecture reading.'
  verified: true
- id: duckdb-paper
  role: secondary
  kind: paper
  title: 'DuckDB: an Embeddable Analytical Database'
  by: Mark Raasveldt, Hannes Muhleisen (SIGMOD 2019 demo)
  url: https://duckdb.org/pdf/SIGMOD2019-demo-duckdb.pdf
  edition_or_term: SIGMOD 2019 demonstration paper
  access: free
  use: Short read on design goals (in-process, vectorized, push-based) before the DuckDB lecture; follow with the DuckDB docs (https://duckdb.org/docs/stable/).
  why: 'Gap: a compact description of a modern open-source vectorized OLAP engine you can experiment with locally.'
  verified: true
- id: arrow-format
  role: reference
  kind: docs
  title: Apache Arrow Columnar Format specification
  by: Apache Software Foundation
  url: https://arrow.apache.org/docs/format/Columnar.html
  edition_or_term: Arrow v26.0.1 documentation
  access: free
  use: Read the layout of primitive, variable-size and nested arrays, validity bitmaps and dictionary encoding; then the Parquet documentation (https://parquet.apache.org/docs/) on row groups, column chunks, pages and encodings.
  why: 'Gap: the in-memory and on-disk columnar formats that underlie every modern OLAP engine; makes lectures 2-3 concrete.'
  verified: true
- id: duckdb-practice
  role: practice
  kind: tool
  title: 'DuckDB hands-on: columnar and vectorized execution in practice'
  by: DuckDB Foundation
  url: https://duckdb.org/docs/stable/
  edition_or_term: Current stable docs
  access: free
  use: 'Exercises: (1) generate TPC-H scale factor 10 with the tpch extension and run queries 1, 3, 5 and 6 with EXPLAIN ANALYZE, noting vectorized operators and pipeline breakers; (2) export the same data to Parquet and compare scan time with a row-store (SQLite or PostgreSQL); (3) write a small vectorized filter-and-aggregate kernel over Arrow arrays in C++, Rust or Python (NumPy/PyArrow) and compare with a tuple-at-a-time loop.'
  why: 'Gap: gives an executable testbed for the vectorized, columnar and Parquet material; DuckDB is open source and embeddable, so experiments are cheap.'
  verified: true
- id: ddia2-storage
  role: secondary
  kind: book
  title: 'Designing Data-Intensive Applications, 2nd edition: Storage and Retrieval'
  by: Martin Kleppmann, Chris Riccomini
  url: https://dataintensive.net/
  edition_or_term: 2nd edition (O'Reilly, March 2026); Chapter 4
  access: paid
  use: 'Chapter 4 ''Storage and Retrieval'': the column-oriented storage, OLAP versus OLTP and vector-index sections, read before 15-721 lectures 2-6.'
  why: 'Gap: a current (2026) textbook treatment of column storage and analytics that the 2015 Red Book lacks. Chapter 4 coverage follows reviewer R4''s study-notes check; not opened directly. Overlap note: db-storage-and-indexing uses this chapter for LSM/B-tree storage, so here read only the columnar and OLAP sections.'
  verified: true
- id: pavlo-2025
  role: secondary
  kind: article
  title: 'Databases in 2025: A Year in Review'
  by: Andy Pavlo
  url: https://www.cs.cmu.edu/~pavlo/blog/2026/01/2025-databases-retrospective.html
  edition_or_term: January 4, 2026 (annual series on Pavlo's blog; the 2024 edition is at https://www.cs.cmu.edu/~pavlo/blog/2025/01/2024-databases-retrospective.html)
  access: free
  use: Read for a current-state-of-the-field overview (lakehouse formats, vector databases, consolidation, cloud-native systems).
  why: 'Gap: the Red Book stops in 2015; an annual review keeps the landscape current.'
  verified: true
considered:
- title: The Design and Implementation of Modern Column-Oriented Database Systems (Abadi et al., FnT 2013)
  url: https://stratos.seas.harvard.edu/files/stratos/files/columnstoresfntdbs.pdf
  reason: Would have been the primary text for columnar storage and late materialization; the link returned 403 to my fetch, so I could not verify it and left it out.
- title: MIT 6.5830 Database Systems (Spring 2026)
  url: https://dsg.csail.mit.edu/6.5830/
  reason: Paper-based graduate course with GoDB labs and a final project; recordings are on Panopto (public access unverified); less focused on columnar and vectorized execution.
- title: CMU 15-799 Query Optimization (Spring 2025)
  url: https://15799.courses.cs.cmu.edu/spring2025/
  reason: Has public videos; it deepens the optimizer part of this node and is listed in the query-processing node.
- title: Database Internals (Petrov)
  url: https://www.databass.dev/
  reason: Covers storage engines and distributed systems, not columnar or vectorized engines; used in the storage node.
- title: CMU Database Group seminar series
  url: https://db.cs.cmu.edu/seminar2025/
  reason: Public talks by system builders; good enrichment, no structured curriculum.
notes: 'No single textbook covers this node. The Red Book (2015) gives background only; the core reading is the paper set (Kersten, Lakehouse, Snowflake, Dremel and the 15-721 papers), with DDIA 2e ch. 4 as a current text. Route: Red Book chapter introductions for the big picture, then CMU 15-721 lectures with their papers (columnar formats, vectorization vs compilation, cloud-native systems), and DuckDB for practice. 15-721 is a lectures-only course with no assignments (paper reviews and a research project only), so the hands-on practice is DuckDB. Fall 2025 15-721 is the latest run but publishes only paper lists and notes (a PR-based lecture notes repo), no videos found; Spring 2024 is the newest with videos. Also see the query-processing node (15-799 for optimizers) and distributed-transactions-and-storage (distributed databases).'
split_proposal: null
prereq_changes: null
open_questions:
- The Fall 2025 15-721 page shows no lecture schedule or video links, only logistics and a pointer to a lecture-notes repository; a /schedule.html page returned 404. Whether Fall 2025 lectures were recorded privately is unknown.
- Spring 2024 15-721 was verified through its schedule page and YouTube playlist page; individual lecture videos were not opened.
- Red Book (redbook.io) opened and read over plain HTTP only (http://www.redbook.io/ch4-newdbms.html); HTTPS connections fail, so the listed https URL is unverified (verified false). The text is from 2015 and no newer edition was found.
