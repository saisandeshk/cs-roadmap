id: llm-evaluation
title: LLM Evaluation
group: G7
paths: [llm, safety]
hard: [language-modeling]
soft: [statistics]
scope: "Benchmarks, contamination, evaluation methodology, LLM-as-judge, statistical rigor."

level: intermediate
estimated_hours: 30
resources:
  - id: hf-evaluation-guidebook
    role: primary-text
    kind: book
    title: "LLM Evaluation Guidebook"
    by: "Clementine Fourrier and the Hugging Face OpenEvals team"
    url: https://huggingface.co/spaces/OpenEvals/evaluation-guidebook
    edition_or_term: "Maintained Space (GitHub copy archived; latest as of Dec 2025 per repo notice); includes yearly reviews 2023-2025"
    access: free
    use: "Automatic benchmarks (basics, designing automatic evaluations, example datasets, tips), Human evaluation, LLM-as-a-judge (choosing a judge, designing prompts, evaluating the evaluator, reward models), Troubleshooting (inference, reproducibility), General knowledge (tokenization, model inference), and the yearly dives."
    why: "Best single practitioner text from the team that ran the Open LLM Leaderboard and lighteval; covers methodology, judge pitfalls and reproducibility issues in one place; free and maintained. (Space renders client-side; contents confirmed from the repository README.)"
    verified: true
  - id: cs336-eval
    role: primary-course
    kind: course
    title: "Stanford CS336, Lecture 12 (Evaluation) with CS224N Winter 2026 Assignment 4 (LLM benchmarking)"
    by: "Percy Liang (CS336); Diyi Yang, Yejin Choi (CS224N)"
    url: https://cs336.stanford.edu/
    edition_or_term: "Spring 2026 (CS336); Winter 2026 (CS224N A4)"
    access: free
    use: "CS336 Lecture 12 'Evaluation' (lecture_12.py executable trace; the course page gives only the title, so check the trace for exact coverage). CS224N A4 handout (assignments_w26/a4.pdf, a4.zip) 'Large language model benchmarking and evaluation'."
    why: "No full university course on LLM evaluation exists publicly; this pairs the one dedicated, recorded Stanford lecture (public) with a public programming assignment. Treat as a partial primary course (one lecture + one assignment)."
    verified: true
    course:
      latest_term: "Spring 2026"
      latest_url: https://cs336.stanford.edu/
      videos: public
      public_videos_url: https://www.youtube.com/playlist?list=PLoROMvodv4rMqXOcazWaTUHhq-yembLCV
      assignments: partial
      assignments_url: https://web.stanford.edu/class/cs224n/#coursework
  - id: lm-eval-harness
    role: practice
    kind: tool
    title: "EleutherAI lm-evaluation-harness"
    by: "EleutherAI"
    url: https://github.com/EleutherAI/lm-evaluation-harness
    edition_or_term: "Current main; plugin system news dated 2026-09; Releases tab empty on page"
    access: free
    use: "Exercise 1: run `lm_eval --model hf` on a small model for hellaswag/arc/mmlu and compare log-likelihood-based vs generative scoring; Exercise 2: write a new task YAML following docs/new_task_guide.md; Exercise 3: run the same task via vLLM and an OpenAI-compatible endpoint and compare scores (docs/interface.md, docs/API_guide.md)."
    why: "The de-facto standard open evaluation backend (60+ benchmarks, many backends); doing the three exercises exposes the prompt-format and tokenization effects the Guidebook warns about."
    verified: true
  - id: inspect
    role: practice
    kind: docs
    title: "Inspect (UK AISI) and inspect_evals"
    by: "UK AI Security Institute, Meridian Labs"
    url: https://inspect.aisi.org.uk/
    edition_or_term: "Current docs; inspect_evals lists 200+ ready-to-run benchmarks"
    access: free
    use: "Tasks (dataset + solver + scorer), Scorers (exact match, model-graded, custom), Eval Sets (limits, parallelism, retries) and Sandboxing for agentic tasks. Exercise: implement a 20-question task with a model-graded scorer, then calibrate the grader against hand labels. Benchmarks: https://ukgovernmentbeis.github.io/inspect_evals/"
    why: "Modern, well-documented framework for writing custom evals and agent evals; also the bridge into the safety evals node."
    verified: true
  - id: error-bars
    role: secondary
    kind: paper
    title: "Adding Error Bars to Evals: A Statistical Approach to Language Model Evaluations"
    by: "Evan Miller (Anthropic)"
    url: https://arxiv.org/abs/2411.00640
    edition_or_term: "2024"
    access: free
    use: "Whole paper (short): standard errors, clustered standard errors, paired comparisons, power analysis for evals."
    why: "Fills the 'statistical rigor' scope item directly; easiest correct treatment of confidence intervals on benchmark scores."
    verified: true
  - id: lessons-trenches
    role: secondary
    kind: paper
    title: "Lessons from the Trenches on Reproducible Evaluation of Language Models"
    by: "Biderman et al. (EleutherAI)"
    url: https://arxiv.org/abs/2405.14782
    edition_or_term: "2024"
    access: free
    use: "Sections on implementation differences, prompt sensitivity, and the lm-eval-harness design for reproducibility."
    why: "Explains why published numbers differ and how the harness addresses it."
    verified: true
  - id: llm-judge
    role: secondary
    kind: paper
    title: "Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena"
    by: "Zheng et al."
    url: https://arxiv.org/abs/2306.05685
    edition_or_term: "NeurIPS 2023"
    access: free
    use: "Judge biases (position, verbosity, self-enhancement), agreement with humans; pair with 'Large Language Models are not Fair Evaluators' (https://arxiv.org/abs/2305.17926) and Length-Controlled AlpacaEval (https://arxiv.org/abs/2404.04475)."
    why: "Foundational study of LLM-as-judge and its biases; the follow-ups show mitigations."
    verified: true
  - id: helm
    role: secondary
    kind: paper
    title: "Holistic Evaluation of Language Models (HELM)"
    by: "Liang et al. (Stanford CRFM)"
    url: https://arxiv.org/abs/2211.09110
    edition_or_term: "2022 paper; living leaderboards at https://crfm.stanford.edu/helm/"
    access: free
    use: "Sections on the scenario x metric taxonomy and the multi-metric reporting (accuracy, calibration, robustness, fairness, efficiency); explore the live site's current leaderboards."
    why: "The reference framework for what to measure beyond accuracy; the site continues to evolve."
    verified: true
  - id: arena
    role: secondary
    kind: paper
    title: "Chatbot Arena: An Open Platform for Evaluating LLMs by Human Preference"
    by: "Chiang et al."
    url: https://arxiv.org/abs/2403.04132
    edition_or_term: "2024"
    access: free
    use: "Bradley-Terry/Elo modelling of pairwise votes, sampling and confidence intervals, style-control caveats."
    why: "Canonical example of human-preference evaluation and its statistics."
    verified: true
  - id: contamination
    role: secondary
    kind: paper
    title: "Proving Test Set Contamination in Black Box Language Models"
    by: "Oren et al."
    url: https://arxiv.org/abs/2310.17623
    edition_or_term: "2023"
    access: free
    use: "Exchangeability test for canonical ordering of test examples; pair with Sclar et al. prompt-format sensitivity (https://arxiv.org/abs/2310.11324) and decontamination sections of Tulu 3 (https://arxiv.org/abs/2411.15124) / Dolma."
    why: "Covers the contamination scope item with a statistically grounded detection method; the companion papers show prompt-sensitivity and practical decontamination."
    verified: true
  - id: benchmarks-mmlu-pro-gpqa
    role: reference
    kind: paper
    title: "Benchmark papers: MMLU, MMLU-Pro, GPQA, SWE-bench"
    by: "Hendrycks et al.; Wang et al.; Rein et al.; Jimenez et al."
    url: https://arxiv.org/abs/2406.01574
    edition_or_term: "MMLU https://arxiv.org/abs/2009.03300; GPQA https://arxiv.org/abs/2311.12022; SWE-bench https://arxiv.org/abs/2310.06770"
    access: free
    use: "Read the construction/annotation sections to learn how benchmarks are built and where they saturate or leak; MMLU-Pro as the answer to MMLU saturation."
    why: "Concrete anchors for the benchmark landscape discussed in the guidebook."
    verified: true
  - id: hamel-evals
    role: secondary
    kind: article
    title: "AI Evals: Everything You Need to Know (Evals FAQ) and A Field Guide to Rapidly Improving AI Products"
    by: "Hamel Husain (with Shreya Shankar)"
    url: https://hamel.dev/blog/posts/evals-faq/
    edition_or_term: "Living FAQ"
    access: free
    use: "Error analysis from traces, binary pass/fail judges, validating judges against human labels, when to use code-based checks; Field Guide: https://hamel.dev/blog/posts/field-guide/"
    why: "Application-level evaluation practice (trace-driven error analysis) that benchmark-oriented sources skip; links to llm-applications."
    verified: true
  - id: anthropic-agent-evals
    role: secondary
    kind: article
    title: "Demystifying evals for AI agents"
    by: "Anthropic Engineering"
    url: https://www.anthropic.com/engineering/demystifying-evals-for-ai-agents
    edition_or_term: "Page opened (live); publication date not read"
    access: free
    use: "Read for how to structure graders, tasks and transcripts for agentic evals; cross-link to llm-agents."
    why: "Fills the agent-evaluation gap in benchmark-centric material."
    verified: true
  - id: lighteval-docs
    role: reference
    kind: docs
    title: "Lighteval documentation"
    by: "Hugging Face"
    url: https://huggingface.co/docs/lighteval/index
    edition_or_term: "Current"
    access: free
    use: "Use as alternative harness to compare scores with lm-eval-harness; custom tasks section."
    why: "Second open harness (the one the Guidebook was written around); useful for cross-checking numbers."
    verified: true
considered:
  - {title: "ARENA 3.x LLM Evaluations (intro to evals, dataset generation, Inspect, agents, AI control)", url: "https://learn.arena.education/chapter3_llm_evals/", reason: "Good free exercise-based course but safety-evals oriented (threat models, control); better for evals-and-red-teaming (G8)."}
  - {title: "Chip Huyen, AI Engineering ch. 3-4 (Evaluation Methodology / Evaluate AI Systems)", url: "https://huyenchip.com/books/", reason: "Strong, current textbook treatment of eval methodology (paid); used as primary for llm-applications instead."}
  - {title: "Stanford HELM codebase", url: "https://crfm.stanford.edu/helm/", reason: "Heavy to run locally; kept as methodology reference."}
  - {title: "Build a Reasoning Model (From Scratch), ch. 3 and appendix F", url: "https://www.manning.com/books/build-a-reasoning-model-from-scratch", reason: "Hands-on verifiers (MATH-500), MMLU, LLM-as-judge from scratch (paid book); good if you want to implement evaluators yourself."}
  - {title: "AI Evals for Engineers and PMs (Hamel Husain, Shreya Shankar; paid cohort course)", url: "https://hamel.dev/", reason: "Probably strong but paid/cohort-based; the free FAQ captures much of it; not opened or verified."}
  - {title: "Open LLM Leaderboard / lm-eval docs (HF)", url: "https://huggingface.co/docs/leaderboards/en/index", reason: "Leaderboard retired per the docs page; historical value only."}
notes: "No strong public university course is dedicated to LLM evaluation, so the primary-course slot is a composite (CS336 L12 + CS224N A4) and should be viewed as weak; the Guidebook is the real spine. Practice is Inspect + lm-eval-harness tasks plus checking error bars on your own results. Suggest the owner treat this node's primary-course as optional."
split_proposal: null
prereq_changes: "llm-evaluation is a hard prereq for G8's evals-and-red-teaming; fine. Consider soft: [post-training] (reward models/judges) and soft: [llm-applications] (application-level evals)."
open_questions:
  - "CS336 Lecture 12 content beyond its title was not inspected."
  - "Date of the Anthropic 'Demystifying evals for AI agents' post not read."
  - "Guidebook Space renders client-side; contents taken from repo README and Space title."
last_verified: 2026-11-18
