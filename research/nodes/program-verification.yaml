notes: 'Choose a proof assistant: Rocq (Software Foundations volumes, FRAP book, OPLSS 2026 lectures, DeepSpec videos) has the richest materials and public lectures; Lean (CIS 5000 materials, TPIL/FPIL) is newer and easier to install. A reasonable route (about 90 h): SF LF to Imp (30 h), PLF Hoare chapters (15 h), SLF intro (15 h), OPLSS 2026 Dreyer and Gardner lectures, then one automated-verification layer (Dafny/Why3/Verus) for ''verified software'' (15 h). The node''s hard prerequisite type-systems is arguably unnecessary for Hoare/separation logic (SF teaches Hoare before types), see prereq_changes.'
split_proposal: Consider splitting into 'proof assistants and Hoare logic' and 'separation logic and verified systems' if material exceeds about 90 h.
prereq_changes: 'type-systems as a hard prerequisite is heavier than needed: LF + PLF Hoare chapters need only programming-language-concepts and discrete-math. Suggest hard: [programming-language-concepts, discrete-math] and soft: [type-systems].'
open_questions: [MIT 6.512 Fall 2025 site is JavaScript-rendered; content and video availability could not be read., OPLSS 2026 MP4 links are relative paths on the topics page; playback not tested., Penn CIS 5000 Lean homework availability (as opposed to lecture files) not confirmed.]
last_verified: '2026-11-18'
